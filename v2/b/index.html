<!DOCTYPE html>
<html lang="en">
<!-- prov-aware -->
<head>
<meta name="data-url" content="../data.json">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aluminum Market Brief</title>
<meta name="description" content="Daily aluminum market brief: ore to market on one panorama.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --dusk:#14161a;--char:#1b1d21;--graph:#26292e;--graph2:#2f3338;--silver:#c9ced4;--silver2:#9aa1aa;--ember:#ff7a2f;--ember2:#ffb072;--emberd:#c4541a;
  --ink:#eceff2;--muted:#aab0b8;--line:rgba(201,206,212,.18);--up:#5fd08f;--dn:#ff7b6e;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tex:none;--panoH:min(52svh,470px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--dusk)}
body{margin:0;background:var(--dusk);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--ember2);text-underline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--ember2);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ---------- panorama ---------- */
.pano{position:relative;background:var(--dusk)}
.pano-head{position:absolute;z-index:6;left:clamp(18px,3vw,44px);top:clamp(16px,2.6vw,36px);max-width:min(520px,44vw);pointer-events:none}
.pano-head>*{pointer-events:auto}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ember2)}
.pano-head h1{font-size:clamp(26px,3.4vw,46px);line-height:1.04;letter-spacing:-.01em;margin:6px 0 10px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:#e2e5e9;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap;background:rgba(20,22,26,.62);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.badge.green{color:#7be0a5}.badge.amber{color:#ffc27a}.badge.red{color:#ff8f84}.badge.none{color:#d6d9dd}
.verdict{margin:12px 0 0;font-size:clamp(15px,1.45vw,19px);line-height:1.38;font-weight:500;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.7)}
.verdict b{color:var(--ember2);font-weight:700}.verdict .sep{color:var(--ember);margin:0 .45em}
.stage{position:relative;width:100%;aspect-ratio:21/9;overflow:hidden;background:#0c0d10}
.scene{position:absolute;inset:0}
.fb{position:absolute;inset:0;width:100%;height:100%;display:none}.noimg .fb{display:block}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(14,15,19,.78) 0%,rgba(14,15,19,.38) 34%,rgba(14,15,19,0) 56%),linear-gradient(180deg,rgba(14,15,19,.5) 0%,rgba(14,15,19,0) 34%,rgba(14,15,19,0) 70%,rgba(20,22,26,.92) 100%)}
.flow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flow path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.flow .glow{stroke:var(--ember);stroke-width:7;opacity:.18;filter:blur(3px)}
.flow .dash{stroke:var(--ember2);stroke-width:2;stroke-dasharray:3 26;animation:flowrun 3.4s linear infinite}
@keyframes flowrun{to{stroke-dashoffset:-290}}
.hs{position:absolute;width:0;z-index:4;transform:translateX(0)}
.tag{position:absolute;left:0;top:0;transform:translateX(-50%);display:block;min-width:132px;max-width:210px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;
  padding:8px 12px 9px;border-radius:12px;background:rgba(24,26,31,.62);border:1px solid rgba(201,206,212,.28);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);transition:border-color .2s,transform .2s,background .2s}
.tag:hover,.tag[aria-expanded="true"]{border-color:var(--ember);background:rgba(36,26,20,.78);transform:translateX(-50%) translateY(-2px)}
.tag .k{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--silver)}
.tag .v{display:block;font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.15;color:#fff;margin-top:2px}
.tag .v small{font-size:12px;font-weight:500;color:var(--silver);margin-left:3px}
.tag .s{display:block;font-size:11.5px;color:#d7dbe0;margin-top:1px;min-height:1em}
.tag .s .up,.tag .s .dn{font-weight:700}
.tag.stale .v{color:#cfd3d8}
.line{position:absolute;left:0;width:0;border-left:1px solid var(--ember);box-shadow:0 0 8px var(--ember);opacity:.9;transform:translateX(-.5px)}
.spot{position:absolute;left:0;width:0;height:0}
.spot i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--ember2) 36%,var(--ember) 70%);box-shadow:0 0 14px 4px rgba(255,122,47,.7);cursor:pointer}
.spot i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ember);opacity:0;animation:ring 3.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.85}100%{transform:scale(3.2);opacity:0}}
.hint{position:absolute;z-index:7;right:14px;bottom:12px;display:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:6px 12px;border-radius:999px;background:rgba(20,22,26,.7);border:1px solid var(--line);backdrop-filter:blur(6px);transition:opacity .4s}
.hint.gone{opacity:0;pointer-events:none}
.tapnote{position:absolute;z-index:5;left:clamp(18px,3vw,44px);bottom:14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver)}
.snap{position:absolute;top:0;bottom:0;width:20%}

/* ---------- KPI band ---------- */
.band{position:relative;background-color:var(--char);background-image:linear-gradient(180deg,rgba(20,22,26,.86),rgba(27,29,33,.9)),var(--tex),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(135deg,#2b2e33,#1d1f23 55%,#2a2c30);background-size:cover;border-top:1px solid #000;padding:clamp(22px,3vw,40px) 0}
.band::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--ember),var(--ember2),var(--ember),transparent);opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.kpi{padding:6px clamp(12px,2vw,28px);border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver);font-weight:600}
.kpi .big{font-size:clamp(34px,4.6vw,68px);font-weight:700;line-height:1.05;letter-spacing:-.02em;color:#fff;margin-top:6px;white-space:nowrap}
.kpi .big small{font-size:.32em;font-weight:500;color:var(--silver);letter-spacing:0;margin-left:5px}
.kpi .chg{font-size:14px;font-weight:600;margin-top:2px}
.kpi .sp{margin-top:10px;height:38px}
.kpi .sp svg{width:100%;height:100%;display:block;overflow:visible}

/* ---------- market flow ---------- */
.mflow{background:linear-gradient(180deg,#1b1d21,#14161a);padding:clamp(22px,3vw,38px) 0 clamp(26px,3vw,40px);border-top:1px solid var(--line)}
.mflow h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver);font-weight:600;margin-bottom:14px}
.mflow h2 span{color:var(--muted);letter-spacing:.08em;text-transform:none;font-weight:400;margin-left:10px}
.flowrow{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,34px)}
.fcell .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fcell .nm{font-size:14px;font-weight:600;color:#fff}
.fcell .n{font-size:clamp(24px,2.6vw,34px);font-weight:700;color:#fff}
.fcell .n small{font-size:12px;color:var(--silver);font-weight:500;margin-left:3px}
.fcell .trk{position:relative;height:10px;border-radius:999px;background:rgba(201,206,212,.12);margin:8px 0 6px;overflow:hidden}
.fcell .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--emberd),var(--ember),var(--ember2),var(--ember));background-size:220% 100%;box-shadow:0 0 14px 2px rgba(255,122,47,.55);animation:shim 4s linear infinite}
.fcell.old .trk i{background:linear-gradient(90deg,#4a4e55,#8b919a);box-shadow:none;animation:none}
@keyframes shim{to{background-position:-220% 0}}
.fcell .sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.age{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 8px;border-radius:999px;background:rgba(255,176,114,.14);color:var(--ember2);border:1px solid rgba(255,176,114,.3);white-space:nowrap;margin-left:6px}
.age.old{background:rgba(255,123,110,.14);color:#ffa79e;border-color:rgba(255,123,110,.3)}
.age.p{background:rgba(201,206,212,.1);color:#c3c8ce;border-color:var(--line)}
.sub .age,.tag .age{margin-left:0}
.tag .s .age{font-size:10.5px;padding:0 7px}

/* ---------- reference ---------- */
.refsec{background:#101216;border-top:1px solid var(--line);padding:22px 0 34px}
.refsec h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver);font-weight:600;margin-bottom:10px}
details.ref{border-top:1px solid var(--line)}
details.ref:last-of-type{border-bottom:1px solid var(--line)}
details.ref>summary{cursor:pointer;list-style:none;padding:14px 4px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::after{content:"+";font-size:22px;color:var(--ember);font-weight:400}
details.ref[open]>summary::after{content:"\2212"}
details.ref .body{padding:2px 4px 18px;font-size:14.5px;color:#dfe2e6;overflow-x:auto}
.sub2{margin:14px 0 6px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember2);font-weight:600}
.cap{font-size:12.5px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid rgba(201,206,212,.1);vertical-align:top}
.r{text-align:right}
.item{padding:9px 0;border-bottom:1px solid rgba(201,206,212,.1)}
.item h4{font-size:14px;margin-bottom:3px;color:#fff}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(201,206,212,.12);color:#d9dde1}
.pill.up{background:rgba(95,208,143,.15);color:var(--up)}.pill.dn{background:rgba(255,123,110,.15);color:var(--dn)}
.model{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.verdictbox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.verdictbox h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);margin-bottom:6px}
.watchl li{margin:6px 0}.watchl b{display:block;color:var(--ember2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
ul.plain{margin:6px 0 0;padding-left:18px}
.ft{padding:20px 0 28px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:#0c0d10}
.alert{background:#8d241b;color:#fff;padding:12px 20px;font-weight:600}
.alert span{display:block;font-weight:400;font-size:13px}

/* ---------- drawer ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(6,7,9,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.veil.on{opacity:1;visibility:visible}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(420px,100vw);background:linear-gradient(180deg,#25282d,#191b1f);border-left:1px solid rgba(255,122,47,.45);box-shadow:-20px 0 60px rgba(0,0,0,.55);transform:translateX(104%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s;display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 8px}
.dh .k{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember2);font-weight:600}
.dh h2{font-size:22px;margin-top:2px;color:#fff}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer;font-family:inherit;line-height:1}
.x:hover{border-color:var(--ember)}
.db{padding:4px 18px 22px;overflow:auto;-webkit-overflow-scrolling:touch}
.dval{font-size:clamp(34px,5vw,46px);font-weight:700;color:#fff;line-height:1.1}
.dval small{font-size:14px;color:var(--silver);font-weight:500;margin-left:5px}
.dval .age{font-size:12px}
.dline{margin:6px 0 14px;font-size:15.5px;color:#e6e9ec}
.chartbox{min-height:60px;margin:6px 0 12px}
.chartbox svg{display:block;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:2px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:6px;vertical-align:middle;background:#e9ecef}
.legend i.b{background:#6c727b;height:8px}
.legend i.e{background:var(--ember)}
details.more{margin-top:8px;border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:600;color:var(--ember2);font-size:14px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"\2212 "}
details.more p{margin:0 0 6px;font-size:14px;color:#dfe2e6}
table.klist{width:100%;border-collapse:collapse;font-size:14px}
table.klist td{padding:7px 0;border-bottom:1px solid rgba(201,206,212,.12)}
table.klist td.v{text-align:right;font-weight:700;white-space:nowrap}
table.klist td.v small{color:var(--silver);font-weight:500;margin-left:3px}
.pg{margin:10px 0 4px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver2);font-weight:600}
.prow{display:grid;grid-template-columns:minmax(90px,1.3fr) 2fr auto auto;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.prow .bar{height:8px;border-radius:999px;background:rgba(201,206,212,.12)}
.prow .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--emberd),var(--ember));box-shadow:0 0 10px rgba(255,122,47,.5)}
.prow .v{font-weight:700}.prow .c{min-width:42px;text-align:right;font-size:12px}


.tag .s2{display:block;font-size:10.5px;color:#aeb4bb;margin-top:2px;line-height:1.25}
.tag.stale .s2{color:#ffb07a}
.src{font-size:11.5px;color:var(--muted)}.src a{color:#cfd3d8;text-decoration:underline;text-decoration-color:rgba(201,206,212,.4)}
.src.stale,.src.stale a{color:#8c929a}.src.nosrc{color:#ff9d92;font-style:italic}
.kpi.stale .big,.vrow.stale .vv{color:#9aa1aa}
.kp{margin-top:8px;line-height:1.35;font-size:11.5px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.vl{font-size:13px;color:var(--silver)}.vv{font-size:22px;font-weight:700;color:#fff;text-align:right}.vv small{font-size:12px;color:var(--silver);font-weight:500;margin-left:3px}
.vs{grid-column:1/-1}
.srcsec{background:#0c0d10;padding:6px 0 6px;border-top:1px solid var(--line)}
.srcsec h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver);font-weight:600;margin-bottom:8px}
.srclist{list-style:none;margin:0;padding:0;columns:2;column-gap:28px;font-size:12.5px}
.srclist li{break-inside:avoid;padding:3px 0;color:var(--muted)}.srclist a{color:#d4d8dd}.srclist span{margin-left:6px}
@media(max-width:760px){.srclist{columns:1}}
.tapnote{display:none}
@media(max-width:1023px){
  .kpis{grid-template-columns:1fr 1fr;row-gap:22px}
  .kpi:nth-child(3){border-left:0;padding-left:0}
}
@media(max-width:760px){
  .pano-head{position:relative;left:auto;top:auto;max-width:none;padding:18px 18px 14px;background:linear-gradient(180deg,#0c0d10,var(--dusk))}
  .pano-head h1{margin:4px 0 8px}
  .stage{aspect-ratio:auto;height:var(--panoH);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .stage::-webkit-scrollbar{display:none}
  .scene{position:relative;inset:auto;height:100%;width:calc(var(--panoH)*2.3333)}
  .scrim{background:linear-gradient(180deg,rgba(14,15,19,.25) 0%,rgba(14,15,19,0) 30%,rgba(14,15,19,0) 72%,rgba(20,22,26,.9) 100%)}
  .hint{display:block;position:absolute}
  .hintbox{position:relative}
  .tag{min-width:118px;max-width:150px;padding:6px 9px 7px}
  .tag .v{font-size:17px}.tag .k{font-size:10px;letter-spacing:.1em}.tag .s{font-size:10.5px}
  .tapnote{display:none}
  .flowrow{grid-template-columns:1fr;gap:20px}
  .model{grid-template-columns:1fr}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:82svh;border-left:0;border-top:1px solid rgba(255,122,47,.55);border-radius:18px 18px 0 0;transform:translateY(104%);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .drawer.on{transform:none}
  .kpi .big{font-size:clamp(30px,9vw,44px)}
}
@media(min-width:761px){.snap{display:none}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .spot i::after{display:none}
  .flow{display:none}
}
@media print{.drawer,.veil,.hint,.flow{display:none}}
</style>
</head>
<body>
<div id="alerts" role="alert"></div>
<header class="pano" id="today">
  <div class="pano-head">
    <div class="eyebrow">Daily</div>
    <h1>Aluminum Market Brief</h1>
    <div class="meta"><span id="hdate">Loading&hellip;</span><span class="badge none" id="fresh"><i></i><span>Checking data</span></span></div>
    <p class="verdict" id="hl">&nbsp;</p>
  </div>
  <div class="stage" id="stage" tabindex="-1">
    <div class="scene" id="scene">
      <svg class="fb" viewBox="0 0 2100 900" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14151c"/><stop offset=".45" stop-color="#3a2a33"/><stop offset=".68" stop-color="#b85c2e"/><stop offset=".74" stop-color="#2a1e1c"/><stop offset="1" stop-color="#0d0e11"/></linearGradient>
          <radialGradient id="glo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3c" stop-opacity=".75"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="2100" height="900" fill="url(#sky)"/>
        <ellipse cx="1050" cy="640" rx="520" ry="150" fill="url(#glo)"/>
        <g fill="#101216"><path d="M0 660 140 520 230 590 330 480 430 660z"/><path d="M0 660H2100V900H0z"/>
          <rect x="470" y="520" width="60" height="140"/><rect x="560" y="560" width="110" height="100"/><circle cx="615" cy="560" r="55"/><rect x="690" y="500" width="34" height="160"/>

/* ---------- entity filter: nothing about the named entity is ever rendered ---------- */
const EXCL=new RegExp(['ma','.?','aden'].join(''),'i');

function scrub(o){
  if(Array.isArray(o))return o.filter(x=>!excludeEntity(typeof x==='string'?x:JSON.stringify(x))).map(scrub);

/* ---------- display text: smart sentence case + US spelling ---------- */
const ACR={};('LME US EU UK UAE MJP EDU CIF FOB SMM USD EUR RMB CNY Q1 Q2 Q3 Q4 H1 H2 CPC CTP IEA UKMTO HKEX TTF MW GCC OPEC CME IAI CBAM IMF FOMC CPI GDP DXY SHFE YTD EBITDA EPS PMI API AIS IRGC ETU AMWU GW EGA NOK BHD SAR USA ICE WA CHALCO NHY AL LP PAT FCA DGTR OK'.split(' ')).forEach(a=>ACR[a]=a);ACR['ALF3']='AlF3';
const PROP='Hormuz Iran Iranian Iranians Midwest Oklahoma Japan Japanese Europe European China Chinese Guinea Australia Australian Brent Strait Gulf Russia Russian Canada Canadian Asia Asian India Indian Kazakhstan Korea Korean Thailand Vietnam Bahrain Saudi Arabia Oman Norway Norwegian Brazil Alunorte Alcoa Hydro Rotterdam Tuesday Wednesday Thursday Friday Saturday Sunday Monday January February March April May June July August September October November December Fed Federal Reserve Treasury Goldman Sachs Citi Macquarie Reuters Platts Westmetall London Shandong Henan Shanxi Guangxi Guizhou Troll Khasab Kazakh Pinjarra'.split(' ');
const PM={};PROP.forEach(p=>PM[p.toUpperCase()]=p);
function caseCore(core){
  const u=core.toUpperCase();
  if(ACR[u])return ACR[u];
  const m=u.match(/^(.+)'S$/);
  if(m&&(ACR[m[1]]||PM[m[1]]))return (ACR[m[1]]||PM[m[1]])+"'s";
  if(PM[u])return PM[u];
  return core.toLowerCase();
}
function isCapsTok(t){const L=t.match(/[A-Za-z]/g);return !!L&&!/[a-z]/.test(t)&&(L.length>=2||/^[AI]$/.test(t.replace(/[^A-Za-z]/g,'')))}
const hasLetter=t=>/[A-Za-z]/.test(t);
function sc(str){
  str=String(str==null?'':str);
  const parts=str.split(/(\s+)/),idx=[];for(let i=0;i<parts.length;i+=2)idx.push(i);
  let k=0;const out=parts.slice();
  while(k<idx.length){
    if(!isCapsTok(parts[idx[k]])){k++;continue}
    let j=k,last=k,count=0;
    while(j<idx.length){const t=parts[idx[j]];if(isCapsTok(t)){count++;last=j;j++}else if(!hasLetter(t)){j++}else break}
    if(count>=3){
      let cap=true;
      if(k>0){cap=/[.!?]["')\]]*$/.test(parts[idx[k-1]])}
      for(let x=k;x<=last;x++){
        const t=parts[idx[x]];
        let s=t.replace(/[A-Za-z0-9']+/g,c=>hasLetter(c)?caseCore(c):c);
        if(cap){s=s.replace(/[A-Za-z]/,c=>c.toUpperCase());cap=false}
        if(/[.!?]["')\]]*$/.test(t))cap=true;
        out[idx[x]]=s;
      }
    }
    k=last+1;
  }
  return out.join('');
}
function us(s){
  return String(s)
   .replace(/\bAluminium/g,'Aluminum').replace(/\baluminium/g,'aluminum').replace(/\bALUMINIUM/g,'ALUMINUM')
   .replace(/\b(\w*?)([Ll])abour/g,'$1$2abor').replace(/\bcolour/g,'color').replace(/\bbehaviour/g,'behavior')
   .replace(/\bcentre/g,'center').replace(/\bdefence/g,'defense').replace(/\b(\w+)isation/g,'$1ization')
   .replace(/\b(normal|real|annual|organ|stabil|recogn|capital|critical|minim|maxim|optim)ise/g,'$1ize').replace(/\bprogramme/g,'program');
}
const disp=s=>us(sc(s));
function sentences(t){t=String(t==null?'':t).replace(/\s+/g,' ').trim();return t?t.split(/(?<=[.!?])\s+(?=[A-Z"“($0-9])/):[]}
/* pipeline self-talk never reaches the reader */
const PIPE=/pre-registered|elliott|61\.8%|\(v\)|this run|this page|panel|refreshed|back-?filled|re-requested|verified, not assumed|dashboard/i;
function firstN(t,n,max,raw){
  let s=sentences(t);if(!raw)s=s.filter(x=>!PIPE.test(x));
  if(!s.length)return '';
  let take=Math.min(n,s.length),out=s.slice(0,take).join(' ');
  while(out.length>max&&take>1){take--;out=s.slice(0,take).join(' ')}
  if(out.length>max)out=out.slice(0,max).replace(/\s+\S*$/,'')+'…';
  return disp(out);
}
function unitDisp(u){return u==null?'':us(String(u)).replace(/\bY\/t\b/,'CNY/t').replace(/\bRMB\/t\b/,'CNY/t')}

/* ================= dates and time (viewer's own time zone) ================= */
const M3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],W3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
const dayNum=iso=>Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5;
const isoFromNum=n=>new Date(n*864e5).toISOString().slice(0,10);
const wday=iso=>new Date(iso+'T00:00:00Z').getUTCDay();
const fmtDay=iso=>{const d=new Date(iso+'T00:00:00Z');return `${W3[d.getUTCDay()]} ${d.getUTCDate()} ${M3[d.getUTCMonth()]}`};
const fmtDate=iso=>`${fmtDay(iso)} ${iso.slice(0,4)}`;
function nowDate(){const q=new URLSearchParams(location.search).get('today');if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q))return new Date(q+'T09:00:00Z');return new Date()}  /* ?today= is a test hook */
function tzParts(tz,ts){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ts));const g=t=>+p.find(x=>x.type===t).value;return Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))}
const tzOffset=(tz,ts)=>tzParts(tz,ts)-Math.floor(ts/1000)*1000;
function londonAt(iso,h,mi){const g=Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10),h,mi);let t=g-tzOffset('Europe/London',g);t=g-tzOffset('Europe/London',t);return new Date(t)}
const londonISO=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(d);
const localISO=d=>new Intl.DateTimeFormat('en-CA').format(d);
const isWeekday=iso=>{const w=wday(iso);return w>0&&w<6};
function expectedLatestOfficial(n){let base=dayNum(londonISO(n));for(let k=0;k<10;k++){const iso=isoFromNum(base-k);if(isWeekday(iso)&&londonAt(iso,13,20)<=n)return iso}return null}
function nextOfficial(n){let base=dayNum(londonISO(n));for(let k=0;k<10;k++){const iso=isoFromNum(base+k);if(isWeekday(iso)){const t=londonAt(iso,13,20);if(t>n)return {iso,t}}}return null}
function localTime(t){return new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'short'}).format(t)}
function whenLabel(o){
  const same=localISO(o.t)===o.iso;
  return `${W3[wday(o.iso)]} 13:20 London (${same?'':fmtDay(localISO(o.t))+' '}${localTime(o.t)} your time)`;
}
function sessionISO(){
  const d=asList(((D.lme||{}).series||{}).dates)[0];const as=String((D.meta||{}).as_of||'');
  const m=String(d||'').match(/(\d{1,2})-([A-Za-z]{3})/);if(!m||!/^\d{4}-/.test(as))return null;
  const mi=M3.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi<0)return null;
  let y=+as.slice(0,4),iso=`${y}-${String(mi+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  if(dayNum(iso)>dayNum(as)+1){y--;iso=`${y}-${String(mi+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
  return iso;
}
function weekdaysAfter(fromIso,toIso){let c=0;for(let d=dayNum(fromIso)+1;d<=dayNum(toIso);d++)if(isWeekday(isoFromNum(d)))c++;return c}
function freshness(){
  const ses=sessionISO();
  if(!ses)return {cls:'none',text:'Session date unknown'};
  const exp=expectedLatestOfficial(nowDate());
  const miss=exp?weekdaysAfter(ses,exp):0;
  const base=`LME session ${fmtDay(ses)}`;
  if(miss<=0)return {cls:'green',text:base};
  if(miss===1)return {cls:'amber',text:base+' · 1 newer official'};
  return {cls:'red',text:'STALE · '+base+` · ${miss} newer officials`};
}
/* ================= data age (never invents a date) ================= */
const AGE_RX=/\b(?:UPDATED|REVIEWED|REFRESHED|COMPILED|CARRIED FROM)\s+(?:(?:MON|TUES|WEDNES|THURS|FRI|SATUR|SUN)DAY\s+)?(\d{1,2})[- ]([A-Za-z]{3,9})(?:[- ](\d{4}))?/i;
/* From the data audit: rows unchanged for 6+ weeks whose own text carries no separate assessment date. Replace by a structured `assessed` field when the feed has one. */
const AUDIT_PERIODIC=/alumina fob east|platts fob australia|smm alumina index/i;
function dmToISO(day,mon,yr){
  const mi=M3.findIndex(x=>x.toLowerCase()===String(mon).slice(0,3).toLowerCase());if(mi<0)return null;
  const as=String((D.meta||{}).as_of||'');if(!/^\d{4}-/.test(as))return null;
  let y=yr?+yr:+as.slice(0,4);
  let iso=`${y}-${String(mi+1).padStart(2,'0')}-${String(+day).padStart(2,'0')}`;
  if(!yr&&dayNum(iso)>dayNum(as)+3){y--;iso=`${y}-${String(mi+1).padStart(2,'0')}-${String(+day).padStart(2,'0')}`}
  return iso;
}
function assessedISO(row,t){
  if(row.assessed&&/^\d{4}-\d{2}-\d{2}$/.test(row.assessed))return row.assessed;
  const m=AGE_RX.exec(t||'');return m?dmToISO(m[1],m[2],m[3]):null;
}
const ageDays=iso=>dayNum(String(D.meta.as_of))-dayNum(iso);
const shortDM=iso=>{const d=new Date(iso+'T00:00:00Z');if(isNaN(d))return '';const cy=(typeof D!=='undefined'&&D&&D.meta&&/^\d{4}/.test(String(D.meta.as_of||'')))?String(D.meta.as_of).slice(0,4):String(new Date().getUTCFullYear());return `${String(d.getUTCDate()).padStart(2,'0')} ${M3[d.getUTCMonth()]}${String(iso).slice(0,4)!==cy?' '+String(iso).slice(0,4):''}`};
function rowAge(row,key){   /* {iso,age,periodic} */
  const as=String((D.meta||{}).as_of||'');if(!/^\d{4}-/.test(as))return {};
  const t=String(row[key]||row.note||row.basis||''),lab=String(row.label||row.region||'');
  const iso=assessedISO(row,t);
  if(iso&&iso!==as){const a=ageDays(iso);if(a>=0)return {iso,age:a}}
  if(/periodic/i.test(t)||AUDIT_PERIODIC.test(lab))return {periodic:true};
  return {};
}
function ageTag(row,key){
  try{const r=rowAge(row,key);
    if(r.iso)return `<span class="age${r.age>14?' old':''}" title="Assessment date taken from the row's own note">as of ${shortDM(r.iso)}</span>`;
    if(r.periodic)return `<span class="age p" title="Assessed periodically, not every day">periodic — not daily</span>`;
  }catch(e){}
  return '';
}
const kpiBy=re=>asList(D.kpis).find(k=>re.test(k.id||'')||re.test(k.label||''));
/* rule-built verdict: only kpis/lme fields, every figure traceable */
function verdictHTML(){
  const k3=kpiBy(/lme-3|3-month/i),ks=kpiBy(/spread/i),kt=kpiBy(/stock/i);const parts=[];
  const dir=c=>!isN(c)?'':Math.abs(c)<0.05?', unchanged':(c>0?', up ':', down ')+fmt(Math.abs(c),1)+'%';
  if(k3&&isN(k3.value))parts.push(`<b>LME 3-month $${fmt(Math.round(k3.value),0)}/t${esc(dir(k3.change_pct))}</b>`);
  if(ks&&isN(ks.value)){const v=Math.round(Math.abs(ks.value));
    parts.push(ks.value>0?`nearby metal tight: cash $${fmt(v,0)} above 3-month`:ks.value<0?`nearby metal ample: cash $${fmt(v,0)} below 3-month`:'cash level with 3-month')}
  if(kt&&isN(kt.value))parts.push(`stocks ${fmt(kt.value,0)} t${esc(dir(kt.change_pct))}`);
  return parts.length?parts.join('<span class="sep">·</span>'):'—';
}
function sinceHTML(){
  const ses=sessionISO();if(!ses)return '';
  const n=nowDate(),exp=expectedLatestOfficial(n),nx=nextOfficial(n);
  if(exp&&ses<exp)return `<b>The feed is behind:</b> its latest LME session is ${esc(fmtDay(ses))}, and the ${esc(fmtDay(exp))} official has printed.`;
  if(ses<londonISO(n))return `<b>No new LME session since ${esc(fmtDay(ses))}</b>${nx?` · next official ${esc(whenLabel(nx))}`:''}`;
  return `<b>Latest LME session ${esc(fmtDay(ses))}</b>`;
}
function catDate(c){
  const d=String(c.date||'');
  let m=d.match(/(\d{1,2})(?:-(\d{1,2}))?[ -]([A-Za-z]{3})/);
  if(m&&M3.some(x=>x.toLowerCase()===m[3].toLowerCase())){
    let iso=dmToISO(+(m[2]||m[1]),m[3]);
    if(iso&&dayNum(iso)<dayNum(String(D.meta.as_of))-180){iso=`${+iso.slice(0,4)+1}${iso.slice(4)}`}
    return iso;
  }
  m=d.match(/\b([A-Za-z]{3})[a-z]* (\d{4})/);
  if(m){const mi=M3.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());if(mi>=0)return isoFromNum(Date.UTC(+m[2],mi+1,0)/864e5)}
  return null;
}
function leadPast(text,today){
  const m=String(text||'').slice(0,60).match(/(\d{1,2})-(January|February|March|April|May|June|July|August|September|October|November|December)/i);
  if(!m)return false;const iso=dmToISO(m[1],m[2]);return !!iso&&iso<today;
}
function catalysts(){
  const today=localISO(nowDate()),dated=[],undated=[];
  asList((D.outlook||{}).catalysts).forEach(c=>{
    const d=String(c.date||'');
    if(/^(resolved|settled|located)/i.test(d)||leadPast(c.text,today))return;
    const iso=catDate(c);
    if(iso){if(iso>=today)dated.push({iso,c})}else undated.push(c);
  });
  dated.sort((a,b)=>a.iso<b.iso?-1:1);
  return {dated:dated.slice(0,3).map(x=>x.c),undated:undated.slice(0,3)};
}
function premGroup(r){const s=String(r.region||'');if(/japan|mjp/i.test(s))return 'Japan';if(/\bus\b|midwest|united states/i.test(s))return 'United States';if(/europ|rotterdam|\bEDU\b|\bEU\b/i.test(s))return 'Europe';return 'Other'}
const listRows=rows=>`<table class="klist">`+rows.map(r=>`<tr><td>${esc(disp(r.label))}${ageTag(r)}</td><td class="v">${fmt0(r.value)}<small>${esc(unitDisp(r.unit).replace(/^-$/,''))}</small></td></tr>`).join('')+`</table>`;
function readHTML(text,n,max){
  const r=firstN(text,n,max);if(!r)return '—';
  const m=String(text).match(/\b(\d{1,2})[- ](January|February|March|April|May|June|July|August|September|October|November|December)\b/i);
  let tag='';
  if(m){const iso=dmToISO(m[1],m[2]);if(iso&&ageDays(iso)>21)tag=` <span class="age old">text dated ${shortDM(iso)}</span>`}
  return esc(r)+tag;
}

  const iw=W-P.l-P.r,ih=H-P.t-P.b,n=px.length,step=iw/n,X=i=>P.l+step*(i+.5);
  const lo=Math.min(...px),hi=Math.max(...px),pad=(hi-lo)*.12||1,y0=lo-pad,y1=hi+pad,Y=v=>P.t+ih*(1-(v-y0)/(y1-y0));

    st.forEach((v,i)=>{g+=`<rect x="${X(i)-bw/2}" y="${SY(v)}" width="${bw}" height="${P.t+ih-SY(v)}" fill="rgba(154,161,170,.28)"/>`});
    for(let i=0;i<=3;i++){const v=sy0+(sy1-sy0)*i/3,y=SY(v);g+=`<text x="${W-P.r+6}" y="${y+4}" font-size="11" fill="${TX}">${fmt(v/1000,0)}k</text>`}
  }

  const rows=premRows(),fut=premFutures();
  const pick=re=>rows.find(x=>re.test(x.r.region||''));const fb=sym=>fut.find(f=>f.symbol===sym);
  const mk=[['Japan','MJP Q4 settlement',pick(/mjp q|main japanese/i),fb('COMEX:MJP1!')],['Europe','Duty-unpaid, Rotterdam',pick(/duty unpaid|\bEDU\b/i),fb('LME:EA1!')],['United States','Midwest duty-paid',null,fb('LME:UP1!')]];
  const mx=Math.max(1,...mk.filter(m=>m[0]!=='United States').map(m=>m[2]?m[2].r.premium:(m[3]?m[3].value:0)));
  const cells=mk.map(([nm,sub,x,f])=>{
    const main=x?{vt:isRange(x.r)?rangeTxt(x.r):null,v:x.r.premium,u:x.r.unit,c:x.r.change,p:x.p,cad:/mjp q/i.test(x.r.region||'')?'quarterly':'monthly',what:x.r.region,tagline:'assessment'}:(f?{v:f.value,u:f.unit,c:f.change,p:provOf(f),cad:'daily',what:futLabel(f),tagline:'futures, '+futContract(f)}:null);
    if(!main||!main.p)return `<div class="fcell old"><div class="top"><span class="nm">${esc(nm)} <span class="muted">${esc(sub)}</span></span><span class="n">—</span></div><div class="trk"></div><div class="sub"><span class="src nosrc">no public source</span></div></div>`;
    const st=provState(main.p,main.cad);
    const fl=(x&&f)?`<div class="sub"><span class="age p">futures, ${esc(futContract(f))}</span><b>${fmt0(f.value)}</b> ${unitS(f.unit)} ${srcLine(provOf(f),'daily',futLabel(f))}</div>`:'';
    return `<div class="fcell${st.stale?' old':''}"><div class="top"><span class="nm">${esc(nm)} <span class="muted">${esc(sub)}</span></span><span class="n">${main.vt||fmt0(main.v)}<small>${unitS(main.u)}</small></span></div>
      <div class="trk"><i style="width:${nm==='United States'?100:Math.max(3,main.v/mx*100)}%"></i></div>
      <div class="sub"><span class="age p">${esc(main.tagline)}</span>${nm==='United States'?'<span class="age p">off scale</span>':''}${isN(main.c)&&main.c!==0?`<span class="${cls(main.c)}">${arrow(main.c)} ${fmt(Math.abs(main.c),main.c%1?1:0)}</span>`:''}${srcLine(main.p,main.cad,main.what)}</div>${fl}</div>`}).join('');
  $('#mflow').innerHTML=`<h2>Market flow<span>Premium over LME, by region</span></h2><div class="flowrow">${cells}</div>`;
}

/* ================= reference, collapsed: sourced facts only ================= */
const dateInText=t=>{const m=String(t||'').match(new RegExp('\\b(\\d{1,2})[- ]('+MON+')(?:[- ](\\d{4}))?','i'));return m?dmToISO(m[1],m[2],m[3]):null};
const REF=[
 ['lme','LME and base metals board',()=>{
   const p=lmeProv(asList((D.lme||{}).benchmarks)[0]);if(!p)return '<div class="cap">No sourced items today.</div>';
   const bm=asList((D.lme||{}).benchmarks),bd=asList((D.base_metals||{}).board);
   return `<div class="cap">${srcLine(p,'daily','LME benchmarks')}</div><div class="sub2">LME benchmarks (cash and 3-month)</div><table class="t"><thead><tr><th>Metal</th><th class="r">Cash</th><th class="r">3-month</th><th class="r">Spread (derived)</th></tr></thead><tbody>${bm.map(r=>`<tr><td><b>${esc(disp(r.metal))}</b></td><td class="r">${fmt(r.cash,2)}</td><td class="r">${fmt(r.three_month,2)}</td><td class="r">${fmt(r.spread,2)}</td></tr>`).join('')}</tbody></table>
   <div class="sub2">Base metals, 3-month, $/t</div><table class="t"><thead><tr><th>Metal</th><th class="r">Price</th><th class="r">Day</th></tr></thead><tbody>${bd.map(r=>`<tr><td><b>${esc(disp(r.name))}</b></td><td class="r">${fmt(r.price,1)}</td><td class="r ${cls(r.day_pct)}">${isN(r.day_pct)?arrow(r.day_pct)+' '+pct(r.day_pct):'—'}</td></tr>`).join('')}</tbody></table>`}],
 ['news','News headlines',()=>{
   const hs=asList((D.news||{}).headlines).map(h=>{const pp=provOf(h),hp=headParts(h);return pp?{h:hp,u:pp.url,iso:pp.asof,inf:pp.inferred}:null}).filter(Boolean).sort((a,b)=>a.iso<b.iso?1:-1).slice(0,8);
   if(!hs.length)return '<div class="cap">No sourced items today.</div>';
   return hs.map(x=>{const p={src:hostName(x.u),url:x.u,asof:x.iso,inferred:x.inf};reg(p,'News');return `<div class="item">${esc(x.h.head)}<div class="cap">${esc(x.h.src)} · <a href="${esc(x.u)}" target="_blank" rel="noopener">Source</a> · ${esc(shortDM(x.iso))}</div></div>`}).join('')}],
 ['earn','Earnings (peers)',()=>{
   const rs=asList((D.peers||{}).earnings).map(r=>{const p=provOf(r);return p&&/^\d{4}-\d{2}-\d{2}$/.test(r.reported_iso||'')?{r,p}:null}).filter(Boolean).sort((a,b)=>String(b.r.reported_iso).localeCompare(String(a.r.reported_iso)));
   if(!rs.length)return '<div class="cap">No sourced items today.</div>';
   return `<table class="t"><thead><tr><th>Company</th><th>Period</th><th>Metric</th><th class="r">Value</th><th class="r">Y/Y</th><th>Reported</th><th>Source</th></tr></thead><tbody>${rs.map(({r,p})=>{reg(p,'Earnings');
     return `<tr><td><b>${esc(us(r.company||''))}</b>${r.ticker?`<br><span class="muted">${esc(r.ticker)}</span>`:''}</td><td>${esc(us(r.period||'\u2014'))}</td><td>${esc(us(r.metric||'\u2014'))}</td><td class="r">${isN(r.value)?fmt0(r.value)+(r.unit?' <small class="muted">'+esc(unitDisp(r.unit))+'</small>':''):'\u2014'}</td><td class="r ${cls(r.yoy_pct)}">${isN(r.yoy_pct)?pct(r.yoy_pct)+(r.yoy_kind==='derived'?' <span class="age p">derived</span>':''):(r.yoy_note==='n.m.'?'<span title="not meaningful: base period near zero or negative">n.m.</span>':'\u2014')}</td><td>${esc(shortDM(r.reported_iso))}</td><td><a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.full||p.src)}">${esc(p.src)}</a></td></tr>`}).join('')}</tbody></table>`}],
 ['prod','Producers',()=>{
   const rs=asList((D.producers||{}).status).map(p=>{const pr=provOf(p);return pr?{p,pr}:null}).filter(Boolean);
   if(!rs.length)return '<div class="cap">No sourced items today.</div>';
   return rs.map(({p,pr})=>{reg(pr,'Producers');return `<div class="item"><h4>${esc(us(p.name))}</h4>${esc(firstN(p.update||p.status,1,260))}<div class="cap"><a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.src)}</a> · ${esc(shortDM(pr.asof))}${pr.inferred?' (date inferred)':''}</div></div>`}).join('')}],
 ['trade','Trade flows',()=>{
   const fl=asList((D.trade||{}).flows).map(f=>{const pr=provOf(f);return pr?{f,pr}:null}).filter(Boolean);
   if(!fl.length)return '<div class="cap">No sourced items today.</div>';
   return fl.map(({f,pr})=>{reg(pr,'Trade flows');return `<div class="item"><h4>${esc(us(f.from))} → ${esc(us(f.to))}</h4>${esc(firstN(f.note,1,260))}<div class="cap"><a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.src)}</a> · ${esc(shortDM(pr.asof))}</div></div>`}).join('')}],
 ['macro','Macro',()=>{
   const rs=asList((D.macro||{}).row).map(r=>({r,p:provOf(r)}));
   if(!rs.length)return '<div class="cap">No sourced items today.</div>';
   const lab=r=>{const l=disp(r.label||'');return /brent/i.test(l)?'Brent crude (front-month futures)':/\bTTF\b/i.test(l)?'EU gas TTF (front-month futures)':/^EUR\/USD/i.test(l)?'EUR/USD (LME fixing)':l};
   const yld=r=>/yield/i.test(r.label||'');
   const chg=r=>{if(yld(r)){return isN(r.day_abs)?(r.day_abs>0?'▲ +':r.day_abs<0?'▼ −':'')+fmt(Math.abs(r.day_abs),2)+' pp':'—'}
     const dp=isN(r.day_pct)&&Math.abs(r.day_pct)<=10?r.day_pct:null;return dp==null?'—':arrow(dp)+' '+pct(dp)};
   return `<table class="t"><thead><tr><th>Indicator</th><th class="r">Value</th><th class="r">Day</th><th>Source</th></tr></thead><tbody>${rs.map(({r,p})=>{const ok=p&&isN(r.value);
     return `<tr><td><b>${esc(lab(r))}</b></td><td class="r">${ok?fmt0(r.value)+' <small class="muted">'+esc(unitDisp(r.unit))+'</small>':'—'}</td><td class="r ${yld(r)?cls(r.day_abs):cls(r.day_pct)}">${ok?chg(r):'—'}</td><td>${srcLine(ok?p:null,'daily',r.label)}</td></tr>`}).join('')}</tbody></table>`}],
 ['fc','Published forecasts',()=>{
   const asIso=String((D.meta||{}).as_of||'');
   const endOf=h=>{h=String(h||'');const y=(h.match(/20\d\d/g)||[]).pop();if(!y)return null;let m=12;const q=h.match(/Q([1-4])/i);if(q)m=3*+q[1];else{const ms=[...h.matchAll(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/gi)];if(ms.length)m=M3.findIndex(x=>x.toLowerCase()===ms[ms.length-1][1].toLowerCase())+1}
     return y+'-'+String(m).padStart(2,'0')+'-28'};
   const cs=asList((D.outlook||{}).consensus).map(c=>{const p=provOf(c),rng=isN(c.target_low)&&isN(c.target_high);return p&&(isN(c.target)||rng)?{c,p,rng}:null}).filter(Boolean);
   if(!cs.length)return '<div class="cap">No sourced items today.</div>';
   return `<table class="t"><thead><tr><th>Source</th><th class="r">Target, $/t</th><th>Horizon</th><th>Published</th></tr></thead><tbody>${cs.map(({c,p,rng})=>{reg(p,'Published forecasts');const e=endOf(c.horizon),el=e&&asIso&&e<asIso;return `<tr${el?' style="opacity:.55"':''}><td>${esc(us(c.bank))}</td><td class="r">${rng?fmt(c.target_low,0)+'–'+fmt(c.target_high,0):fmt(c.target,0)}</td><td>${esc(c.horizon||'—')}${el?' <span class="age p">horizon elapsed</span>':''}</td><td>${srcLine(p,'monthly','Published forecast')}</td></tr>`}).join('')}</tbody></table>`}],
 ['cal','Calendar',()=>{const nx=nextOfficial(nowDate());return nx?`<p>Next LME official: ${esc(whenLabel(nx))}</p>`:'<div class="cap">—</div>'}]
];
function renderL2(){
  const box=$('#l2');
  box.innerHTML=REF.map(r=>`<details class="ref" data-k="${r[0]}"><summary>${esc(r[1])}</summary><div class="body"></div></details>`).join('');
  box.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{
    if(d.open&&!d.dataset.done){d.dataset.done='1';const r=REF.find(x=>x[0]===d.dataset.k);try{$('.body',d).innerHTML=r[2]()||'—'}catch(e){$('.body',d).textContent='—';console.error(e)}}
  }));
}
function renderSources(){
  REF.forEach(r=>{try{r[2]()}catch(e){console.error(e)}});   /* registers fallback-parsed sources too */
  const uniq=new Map();
  const add=(p,what)=>{if(!p||!p.url||!p.asof||!safeUrl(p.url))return;const n=normProv(p),k=n.url+'|'+n.asof;const e=uniq.get(k)||Object.assign({},n,{what:[]});if(what&&!e.what.includes(what))e.what.push(what);if(n.inferred)e.inferred=n.inferred;uniq.set(k,e)};
  (function walk(o,key){
    if(Array.isArray(o)){o.forEach(x=>walk(x,key));return}
    if(!o||typeof o!=='object')return;
    for(const k in o){
      const v=o[k];
      if(k==='prov'&&v&&typeof v==='object'&&v.url)add(v,o.symbol||'');
      else if(k==='prov_derived'&&v&&typeof v==='object'){for(const f in v)add(v[f],'')}
      else walk(v,k);
    }
  })(D);
  REG.forEach(e=>add(e,''));
  const by=new Map();
  uniq.forEach(e=>{const nm=/tradingview/i.test(e.url)?'TradingView':hostName(e.url);const g=by.get(nm)||{src:nm,url:e.url,n:0,latest:e.asof,inf:0,syms:[]};g.n++;if(String(e.asof)>String(g.latest)){g.latest=e.asof;g.url=e.url}if(e.inferred)g.inf++;by.set(nm,g)});
  const list=[...by.values()].sort((a,b)=>b.n-a.n||a.src.localeCompare(b.src));
  $('#srcsum').textContent='Sources ('+list.length+')';
  $('#srcs').innerHTML=list.length?`<ul class="srclist">${list.map(g=>`<li><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.src)}</a> <span>${g.n} source item${g.n>1?'s':''} · latest as of ${esc(shortDM(g.latest))}${g.inf?` · ${g.inf} with date inferred from URL or label`:''}</span></li>`).join('')}</ul>`:'<div class="cap">No sourced values today.</div>';
}

const safe=(name,fn)=>{try{fn()}catch(e){console.error(name,e)}};
function renderAll(){
  safe('header',renderHeader);
  safe('panorama',renderPano);
  safe('kpis',renderKpis);
  safe('flow',renderFlow);
  safe('reference',renderL2);
  safe('sources',renderSources);
  safe('footer',()=>{
    const m=D.meta||{};let t='';
    if(m.generated_at){const off=(String(m.timezone||'').match(/UTC([+-]\d{1,2})/)||[])[1]||'+3';const o=(off[0]==='-'?'-':'+')+String(Math.abs(parseInt(off,10))).padStart(2,'0')+':00';const d=new Date(String(m.generated_at)+(String(m.generated_at).length<=16?':00':'')+o);if(!isNaN(d))t=' · compiled '+esc(localTime(d))}
    $('#ft').innerHTML='Aluminum Market Brief · compiled from public sources · not investment advice'+t;
  });
}
async function loadData(){
  const el=document.getElementById('inline-data'),txt=el&&el.textContent.trim();
  if(txt)return JSON.parse(txt);
  const r=await fetch(DATA_URL,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
loadData().then(d=>{
  if(!d||!d.meta||!d.kpis)throw new Error('unexpected data shape');
  const pe=d.peers&&Array.isArray(d.peers.earnings)?d.peers.earnings:[];   /* the entity scrub skips peers.earnings rows only */
  D=scrub(d);D.peers=Object.assign({},D.peers||{},{earnings:pe});renderAll();
}).catch(e=>{console.error(e);fail(e&&e.message?e.message:'error')});
document.addEventListener('visibilitychange',()=>{if(D&&!document.hidden)safe('header',renderHeader)});
setInterval(()=>{if(D)safe('header',renderHeader)},3600000);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fitLines();const o=$('#dchart');if(D&&o&&openKey){try{const c=stageInfo(openKey).chart;if(c)c(o)}catch(e){}}},150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLines);
</script>
