<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aluminum Market Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#121315;--g1:#1b1d20;--g2:#23262a;--silver:#c9ced4;--ink:#eef0f2;--mut:#aab0b8;--ember:#e0702a;--emb2:#f0a066;--up:#46b27a;--dn:#ef6b60;
 --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--cond:"Barlow Condensed","Barlow",system-ui,"Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:var(--emb2);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.muted{color:var(--mut)}
h1,h2,h3,h4{margin:0;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.badge.green{background:#dcf1e5;color:#1c6a40}.badge.amber{background:#fde7cf;color:#8a4608}.badge.red{background:#f9d9d5;color:#982a21}.badge.none{background:rgba(255,255,255,.16);color:#eee}
.banner-alert{position:relative;z-index:30;background:#d0453a;color:#fff;padding:10px 16px;font-weight:700;font-size:15px}
.banner-alert span{font-weight:400;display:block;font-size:13px}
/* dots */
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:14px}
.dots a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;color:#fff;height:18px}
.dots a span{font-family:var(--cond);font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:0;transition:opacity .2s;text-shadow:0 1px 6px #000}
.dots a:hover span,.dots a:focus-visible span{opacity:1}
.dots a i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;background:transparent;transition:all .2s;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.dots a.on i{background:var(--ember);border-color:var(--ember);transform:scale(1.3)}
/* hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:22px clamp(18px,5vw,72px) 26px;background:#121315}
.hbg{position:absolute;inset:0;background:radial-gradient(70% 90% at 82% 60%,rgba(255,138,40,.55),rgba(224,112,42,.25) 40%,transparent 70%),linear-gradient(115deg,#121315 0%,#1b1d20 50%,#4a2a14 100%)}
.hbg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.hmedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.hscrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,19,21,.92) 0%,rgba(18,19,21,.7) 40%,rgba(18,19,21,.1) 100%),linear-gradient(0deg,rgba(18,19,21,.75),transparent 40%)}
.hero>*:not(.hbg):not(.hmedia):not(picture):not(.hscrim){position:relative}
.htop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tiny{font-family:var(--cond);font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--silver);font-weight:600}
.kick{font-family:var(--cond);font-size:clamp(14px,1.6vw,20px);letter-spacing:.3em;text-transform:uppercase;color:var(--silver);font-weight:600}
.giant{font-family:var(--cond);font-weight:700;font-size:clamp(72px,12vw,180px);line-height:.92;letter-spacing:-.01em;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.5)}
.giant small{font-size:.22em;color:var(--silver);letter-spacing:.06em;margin-left:.3em;font-weight:600}
.gchg{font-family:var(--cond);font-size:clamp(22px,2.6vw,34px);font-weight:700;margin:16px 0 14px}
h1.vline{font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:500;font-size:clamp(18px,1.9vw,26px);line-height:1.35;max-width:34ch;color:#f1f2f4;text-shadow:0 2px 20px rgba(0,0,0,.6)}
h1.vline b{font-weight:700}h1.vline .sep{color:var(--ember);padding:0 .25em}
.cue{align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--silver);text-decoration:none;font-family:var(--cond);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-top:18px}
.cue span{display:block;width:1px;height:42px;background:linear-gradient(var(--silver),transparent);animation:cue 2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.hero .up{color:var(--up)}.hero .dn{color:var(--dn)}
/* chain strip */
.chain{position:relative;background:#121315}
.since{padding:12px clamp(18px,5vw,72px);font-size:14px;color:var(--silver)}
.since b{color:#fff;font-weight:600}
.cscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.cin{position:relative;height:22vh;min-height:190px;min-width:860px;background:radial-gradient(80% 140% at 50% 100%,rgba(224,112,42,.4),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px),linear-gradient(120deg,#121315,#23262a 50%,#3a2314)}
.cin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cin::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,19,21,.92) 0%,rgba(18,19,21,.35) 60%,rgba(18,19,21,.15) 100%)}
.cin::before{content:"";position:absolute;left:5%;right:5%;top:25px;height:2px;z-index:2;background:linear-gradient(90deg,var(--silver),#7d848d)}
.stg{position:absolute;z-index:3;top:20px;transform:translateX(-50%);text-align:center;min-width:110px}
.stg::before{content:"";display:block;width:12px;height:12px;border-radius:50%;background:var(--ember);margin:0 auto 6px;box-shadow:0 0 0 4px rgba(224,112,42,.3)}
.stg h3{font-size:14px;color:#fff;letter-spacing:.16em}
.stg .v{font-family:var(--cond);font-size:22px;font-weight:700;color:#fff;line-height:1.1}
.stg .v small{font-size:12px;font-family:var(--font);color:var(--silver);font-weight:500;margin-left:3px}
.stg .g{font-size:11.5px;color:var(--silver);min-height:16px}
.age{display:inline-block;font-size:11px;font-weight:600;color:#d5d9de;background:rgba(255,255,255,.14);border-radius:3px;padding:0 5px;white-space:nowrap}
.age.p{background:transparent;border:1px dashed rgba(255,255,255,.5)}
.age.old{background:rgba(224,112,42,.3)}
/* chapters */
.chap{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;background:linear-gradient(120deg,#121315,#23262a 55%,#3a2314)}
.chap::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at var(--fx,75%) 40%,rgba(224,112,42,.4),transparent 65%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.cbg{position:absolute;inset:0}.cbg img{width:100%;height:100%;object-fit:cover}
.cscrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,19,21,.9) 0%,rgba(18,19,21,.72) 45%,rgba(18,19,21,.45) 100%),linear-gradient(0deg,rgba(18,19,21,.6),transparent 35%)}
.cwrap{position:relative;width:100%;max-width:1320px;margin:0 auto;padding:72px clamp(18px,5vw,72px);display:grid;grid-template-columns:minmax(260px,.85fr) 1.3fr;gap:clamp(24px,4vw,64px);align-items:center}
.clab{font-family:var(--cond);font-size:16px;letter-spacing:.26em;text-transform:uppercase;color:var(--silver);font-weight:600}
.clab b{color:var(--ember);margin-right:10px}
.cnum{font-family:var(--cond);font-weight:700;font-size:clamp(56px,7vw,104px);line-height:1;color:#fff;margin-top:6px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.cnum small{display:block;font-size:.24em;color:var(--silver);letter-spacing:.12em;text-transform:uppercase;margin-top:10px;font-weight:600}
.cchg{font-family:var(--cond);font-size:26px;font-weight:700;margin-top:2px;min-height:6px}
.cline{font-size:clamp(17px,1.5vw,21px);line-height:1.35;margin:10px 0 14px;max-width:26ch;font-weight:500;color:#f1f2f4;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.rm summary{cursor:pointer;display:inline-block;color:var(--emb2);font-family:var(--cond);letter-spacing:.2em;text-transform:uppercase;font-size:14px;font-weight:600;padding:8px 0;list-style:none}
.rm summary::-webkit-details-marker{display:none}
.rm summary::after{content:" +"}.rm[open] summary::after{content:" \2212"}
.rm .rmb{background:rgba(18,19,21,.78);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:12px 14px;font-size:14.5px;line-height:1.5;max-width:46ch;margin-top:4px}
.glass{background:rgba(18,19,21,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(201,206,212,.28);border-radius:8px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--silver);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;background:#e6e9ed;vertical-align:middle;margin-right:5px}.legend i.b{height:10px;background:rgba(201,206,212,.3);border:1px solid #9aa1aa}
.chartbox{width:100%;min-height:200px}.chartbox svg{display:block}
.cap{font-size:12.5px;color:var(--mut)}
.pg{font-family:var(--cond);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);margin:10px 0 4px;font-weight:600}.pg:first-child{margin-top:0}
.prow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr 62px 56px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.prow .bar{height:14px;background:rgba(255,255,255,.1);border-radius:2px}.prow .bar i{display:block;height:100%;background:linear-gradient(90deg,#9aa1aa,var(--ember));border-radius:2px}
.prow .v{text-align:right;font-weight:700;font-size:16px}.prow .c{text-align:right;font-size:13px;font-weight:700}.prow .nm .age{display:block;width:max-content;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.stat{border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:8px 10px;background:rgba(255,255,255,.04)}
.stat span{display:block;font-size:12px;color:var(--silver)}.stat b{font-family:var(--cond);font-size:26px;line-height:1.1}.stat small{font-size:12px;color:var(--mut);margin-left:3px}
.tone{display:flex;height:34px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.1)}.tone i{display:block;height:100%}
.tonel{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;font-family:var(--cond);font-size:22px;font-weight:700}.tonel small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--silver);margin-left:5px}
.heads{list-style:none;margin:0;padding:0}.heads li{padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14px}.heads li:first-child{border-top:0}.heads .src{display:block;font-size:12px;color:var(--mut)}
.tg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-right:6px;background:rgba(255,255,255,.14)}.tg.up{color:var(--up)}.tg.dn{color:var(--dn)}
.klist{width:100%;border-collapse:collapse;font-size:13.5px}.klist td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}.klist td.v{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}.klist td.v small{font-weight:400;color:var(--mut);margin-left:3px}
.more summary{cursor:pointer;color:var(--emb2);font-size:13px;padding:5px 0}
/* ending */
.pband{position:relative;min-height:34vh;display:flex;align-items:flex-end;overflow:hidden;background:radial-gradient(80% 140% at 20% 100%,rgba(224,112,42,.45),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px),linear-gradient(120deg,#121315,#23262a 60%,#3a2314)}
.pband img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pband::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,19,21,.95),rgba(18,19,21,.3) 70%)}
.pband h2{position:relative;z-index:2;font-size:clamp(28px,4vw,48px);letter-spacing:.26em;padding:0 clamp(18px,5vw,72px) 22px;color:#fff}
.refwrap{background:#17191c;padding:26px clamp(18px,5vw,72px) 56px}
.refwrap>*{max-width:1100px;margin-left:auto;margin-right:auto}
details.ref{background:var(--g1);border:1px solid rgba(255,255,255,.1);border-radius:6px;margin-bottom:10px}
details.ref>summary{cursor:pointer;padding:14px 18px;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:16px;list-style:none;display:flex;justify-content:space-between}
details.ref>summary::-webkit-details-marker{display:none}details.ref>summary::after{content:"+";font-size:22px;color:var(--ember);font-weight:400}details.ref[open]>summary::after{content:"\2212"}
details.ref .body{padding:2px 18px 18px;overflow-x:auto;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:6px 8px;border-bottom:2px solid #4a4f56;white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #2c3036;vertical-align:top}table.t td.r,table.t th.r{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:#2c3036;color:var(--silver)}.pill.up{color:var(--up)}.pill.dn{color:var(--dn)}
.item{padding:10px 0;border-top:1px solid #2c3036}.item:first-child{border-top:0}.item h4{font-size:14px;letter-spacing:.1em;margin-bottom:3px}
.sub2{font-family:var(--cond);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:16px 0 6px}
.model{display:grid;grid-template-columns:1fr 1fr;gap:18px}.verdict{border-left:4px solid var(--ember);background:#121315;padding:12px 14px}.verdict h4{color:var(--emb2);font-size:12px;margin-bottom:4px}
footer.ft{background:#0c0d0e;color:var(--mut);font-size:12.5px;padding:18px clamp(18px,5vw,72px)}
@media (max-width:1023px){.dots{display:none}}
@media (max-width:900px){.cwrap{grid-template-columns:1fr;padding-top:56px;padding-bottom:56px}.cscrim{background:linear-gradient(180deg,rgba(18,19,21,.8),rgba(18,19,21,.7))}.model{grid-template-columns:1fr}.cline{max-width:none}}
@media (max-width:560px){.tiny{letter-spacing:.14em;font-size:13px}.prow{grid-template-columns:minmax(90px,1fr) 1fr 54px 48px;font-size:13px}.hero{padding-top:16px}.glass{padding:14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cue span{animation:none;transform:none}}
@media print{.dots,.cue,.hmedia,.hscrim,.hbg,.cbg,.cscrim,.cin img,.pband{display:none!important}body,.hero,.chap,.refwrap,.chain{background:#fff!important;color:#111!important}.giant,.cnum,h1.vline,.cline{color:#111;text-shadow:none}.hero,.chap{min-height:0}.glass{background:#fff;border-color:#ccc}}
</style>
</head>
<body>
<nav class="dots" aria-label="Chapters" id="dots">
<a href="#hero" data-s="hero" aria-label="Today"><span>Today</span><i></i></a>
<a href="#price" data-s="price" aria-label="Price and stocks"><span>Price</span><i></i></a>
<a href="#premiums" data-s="premiums" aria-label="Premiums"><span>Premiums</span><i></i></a>
<a href="#costs" data-s="costs" aria-label="Costs"><span>Costs</span><i></i></a>
<a href="#risk" data-s="risk" aria-label="Risk"><span>Risk</span><i></i></a>
</nav>
<div id="alerts"></div>
<header class="hero" id="hero" data-sec="hero">
  <div class="hbg" id="hbg"></div><div class="hscrim"></div>
  <div class="htop"><span class="tiny" id="tiny">Aluminum Market Brief</span><span class="badge none" id="fresh"><i></i><span>Checking data</span></span></div>

</header>

<main id="chapters"></main>

<section class="refwrap" id="reference"><div id="l2"></div></section>
<footer class="ft" id="ft"></footer>

const DATA_URL=(()=>{const q=new URLSearchParams(location.search).get('data');return q&&/^[\w.\-\/]+$/.test(q)?q:'../../data.json'})();
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isN=n=>typeof n==='number'&&isFinite(n);

function sc(str){
  str=String(str==null?'':str);

  let k=0;const out=parts.slice();

    while(j<idx.length){const t=parts[idx[j]];if(isCapsTok(t)){count++;last=j;j++}else if(!hasLetter(t)){j++}else break}

function priceChart(el){
  const s=(D.lme||{}).series||{};
  const px=asList(s.price).slice().reverse(),st=asList(s.stocks).slice().reverse(),dt=asList(s.dates).slice().reverse();
  if(px.length<2){el.innerHTML='<div class="cap">No price series in the feed.</div>';return}
  const W=Math.max(260,el.clientWidth||320),H=W<420?240:320,P={l:52,r:st.length?54:12,t:12,b:28};
  const iw=W-P.l-P.r,ih=H-P.t-P.b,n=px.length,step=iw/n,X=i=>P.l+step*(i+.5);
  const lo=Math.min(...px),hi=Math.max(...px),pad=(hi-lo)*.12||1,y0=lo-pad,y1=hi+pad,Y=v=>P.t+ih*(1-(v-y0)/(y1-y0));
  let g='';
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.12)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="12" fill="#c9ced4">${fmt(Math.round(v/10)*10,0)}</text>`}
  if(st.length===n){
    const slo=Math.min(...st),shi=Math.max(...st),sp=(shi-slo)||1,sy0=slo-sp*.15,sy1=shi+sp*.9;
    const SY=v=>P.t+ih*(1-(v-sy0)/(sy1-sy0)),bw=Math.max(4,step*.6);
    st.forEach((v,i)=>{g+=`<rect x="${X(i)-bw/2}" y="${SY(v)}" width="${bw}" height="${P.t+ih-SY(v)}" fill="rgba(201,206,212,.22)" stroke="rgba(201,206,212,.5)" stroke-width=".6"/>`});
    for(let i=0;i<=3;i++){const v=sy0+(sy1-sy0)*i/3,y=SY(v);g+=`<text x="${W-P.r+6}" y="${y+4}" font-size="12" fill="#c9ced4">${fmt(v/1000,0)}k</text>`}
  }
  g+=`<polyline fill="none" stroke="#f4f5f7" stroke-width="3" stroke-linejoin="round" points="${px.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>`;
  px.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===n-1?6:2.5}" fill="${i===n-1?'#e0702a':'#f4f5f7'}"/>`});
  g+=`<text x="${X(n-1)-10}" y="${Y(px[n-1])-12}" text-anchor="end" font-size="15" font-weight="700" fill="#f0a066">${fmt(px[n-1],1)}</text>`;
  const every=W<420?4:3;
  dt.forEach((d,i)=>{if((n-1-i)%every===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#c9ced4">${esc(d)}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="LME cash settlement price with visible stock">${g}</svg>`;
}

  const all=ks.flatMap(k=>h.series[k]).filter(isN);const lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.2||5;

  const cols=['#f4f5f7','#e0702a'];let g='';
  for(let i=0;i<=2;i++){const v=lo-pad+(hi-lo+2*pad)*i/2;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.12)"/><text x="${P.l-5}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="#c9ced4">${fmt(Math.round(v),0)}</text>`}
  ks.forEach((k,si)=>{const v=h.series[k];
    g+=`<polyline fill="none" stroke="${cols[si]}" stroke-width="3" points="${v.map((a,i)=>isN(a)?`${X(i)},${Y(a)}`:'').filter(Boolean).join(' ')}"/>`;
    v.forEach((a,i)=>{if(isN(a))g+=`<circle cx="${X(i)}" cy="${Y(a)}" r="3" fill="${cols[si]}"/>`});
    const li=v.length-1;if(isN(v[li]))g+=`<text x="${X(li)}" y="${Y(v[li])+(si?-9:18)}" text-anchor="end" font-size="14" font-weight="700" fill="${cols[si]}">${fmt0(v[li])}</text>`;});
  dt.forEach((d,i)=>{if(i===0||i===dt.length-1||dt.length<=4)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===dt.length-1?'end':'middle'}" font-size="12" fill="#c9ced4">${esc(disp(d))}</text>`});
  el.innerHTML=`<div class="legend"><span>Alumina history to ${esc(disp(dt[dt.length-1]))}</span>${ks.map((k,i)=>`<span><i style="background:${cols[i]}"></i>${esc(unitDisp(k).replace(/^API ex-China/,'Alumina price index ex-China (API)'))}</span>`).join('')}</div><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Alumina price history">${g}</svg>`;
}
function drawCharts(){[['#ch1',priceChart],['#ch3',aluminaChart]].forEach(([s,f])=>{const e=$(s);if(e)try{f(e)}catch(x){console.error(s,x);e.innerHTML=''}})}
/* ---- count-up and nav dots ---- */
function setupMotion(){
  const els=[...document.querySelectorAll('.cu')];
  if(!REDUCED&&'IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(!e.isIntersecting)return;io.unobserve(e.target);
      const el=e.target,v=parseFloat(el.dataset.v),d=+el.dataset.d;if(!isFinite(v))return;
      const t0=performance.now(),dur=1100;
      (function f(t){const k=Math.min(1,(t-t0)/dur),ease=1-Math.pow(1-k,3);el.textContent=fmt(v*ease,d);if(k<1)requestAnimationFrame(f);else el.textContent=fmt(v,d)})(t0);
    }),{threshold:.5});
    els.forEach(el=>io.observe(el));
  }
  const dots=[...document.querySelectorAll('#dots a')];
  if('IntersectionObserver' in window){
    const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)dots.forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.dataset.sec))}),{threshold:.55});
    document.querySelectorAll('[data-sec]').forEach(s=>io2.observe(s));
  }
}
function renderContextRef(){
  const b=D.brief||{};
  const wt=asList(b.bullets).find(x=>/^\s*WHAT TO WATCH/i.test(x));
  const watch=wt?us(String(wt).replace(/^\s*WHAT TO WATCH\s*:?\s*/i,'')):'';
  const c=catalysts(),nx=nextOfficial(nowDate());
  const li=x=>`<div class="item"><h4>${esc(us(x.date||''))}</h4>${esc(firstN(x.text,1,170))}</div>`;
  const items=asList(b.bullets).filter(x=>!/^\s*WHAT TO WATCH/i.test(x)).map(x=>{const m=String(x).match(/^\s*([A-Z0-9][A-Z0-9 \-\/&]{2,40}):\s*(.*)$/);const bd=firstN(m?m[2]:String(x),2,330);return {label:m?disp(m[1]):'',body:bd.charAt(0).toUpperCase()+bd.slice(1)}}).filter(x=>x.body);
  return `${firstN(b.headline,3,420)?`<p>${esc(firstN(b.headline,3,420))}</p>`:''}${items.map(i=>`<div class="item">${i.label?`<h4>${esc(i.label)}</h4>`:''}${esc(i.body)}</div>`).join('')}
   <div class="sub2">What to watch</div><p>${watch?esc(watch):'—'}</p>${nx?`<div class="item"><h4>Next LME official</h4>${esc(whenLabel(nx))}</div>`:''}${c.dated.map(li).join('')}${c.undated.length?`<div class="sub2">Undated – watch</div>${c.undated.map(li).join('')}`:''}`;
}

/* ================= boot ================= */
const safe=(name,fn)=>{try{fn()}catch(e){console.error(name,e)}};
function initMedia(){
  const bg=$('#hbg'),wide=matchMedia('(min-width:1024px)').matches;
  if(IMG.heroVideo&&!REDUCED&&wide){
    bg.insertAdjacentHTML('afterend',`<video class="hmedia" autoplay muted loop playsinline preload="metadata" poster="${esc(IMG.heroWide)}" aria-hidden="true"><source src="${esc(IMG.heroVideo)}"></video>`);
    const v=$('.hmedia');v.muted=true;v.addEventListener('error',()=>{v.style.display='none'},true);
  }else{
    bg.insertAdjacentHTML('afterend',`<picture>${IMG.heroTall?`<source media="(max-width:699px)" srcset="${esc(IMG.heroTall)}">`:''}<img class="hmedia" src="${esc(IMG.heroWide)}" alt="Molten aluminum pouring in a casthouse" fetchpriority="high" decoding="async" onerror="this.style.display='none'"></picture>`);
  }
  const pb=$('#pband');if(pb)pb.insertAdjacentHTML('afterbegin',imgTag(IMG.potline).replace('alt=""','alt="Row of smelter cells in a potroom"'));
}
function renderAll(){
  safe('header',renderHeader);safe('hero',renderHero);safe('chain',renderChain);safe('chapters',renderChapters);
  safe('reference',()=>{REF.unshift(['ctx','Context and what to watch',renderContextRef]);renderL2()});
  safe('footer',()=>{
    const m=D.meta||{};let t='';
    if(m.generated_at){const off=(String(m.timezone||'').match(/UTC([+-]\d{1,2})/)||[])[1]||'+3';const o=(off[0]==='-'?'-':'+')+String(Math.abs(parseInt(off,10))).padStart(2,'0')+':00';const d=new Date(String(m.generated_at)+(String(m.generated_at).length<=16?':00':'')+o);if(!isNaN(d))t=' · compiled '+esc(localTime(d))}
    $('#ft').innerHTML='Aluminum Market Brief · compiled from public sources · not investment advice'+t;
  });
  safe('motion',setupMotion);
}
async function loadData(){
  const el=document.getElementById('inline-data'),txt=el&&el.textContent.trim();
  if(txt)return JSON.parse(txt);
  const r=await fetch(DATA_URL,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
safe('media',initMedia);
loadData().then(d=>{
  if(!d||!d.meta||!d.kpis)throw new Error('unexpected data shape');
  D=scrub(d);renderAll();
}).catch(e=>{console.error(e);fail(e&&e.message?e.message:'error')});
document.addEventListener('visibilitychange',()=>{if(D&&!document.hidden)safe('header',renderHeader)});setInterval(()=>{if(D)safe('header',renderHeader)},3600000);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(D)drawCharts()},150)});
