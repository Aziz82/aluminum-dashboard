name: Daily aluminum dashboard refresh

# 05:00 UTC = 08:00 Asia/Riyadh (UTC+3) = 06:00 London (BST). GitHub cron is always UTC.
# Deliberately BEFORE the LME ring (officials print 13:20 London): the refresh reports
# the latest PUBLISHED official and says so — it never invents one.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # lets the built-in GITHUB_TOKEN push the refresh

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Resolve report date (UTC)
        id: d
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # ── STEP 1: AI refresh (patch protocol, fail-safe) ────────────────────
      # Any parse / shape / contract / staleness violation exits non-zero and
      # leaves engine/market_data.json untouched, stopping the job before publish.
      - name: AI refresh of market data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-5
          WEB_SEARCH_MAX_USES: "20"
          EXPECT_DATE: ${{ steps.d.outputs.date }}
        run: python engine/refresh_ai.py engine

      # ── STEP 2: build the published data.json + refresh the shell ─────────
      - name: Build dashboard data.json
        run: |
          python engine/build_data_json.py engine .
          cp engine/index.html index.html

      # ── STEP 3: HARD GATE. Non-zero exit stops the job here and the
      # previously published dashboard stays live and untouched. ────────────
      - name: Validate dashboard (blocking)
        env:
          EXPECT_DATE: ${{ steps.d.outputs.date }}
        run: python engine/validate_dashboard.py engine .

      # ── STEP 4: publish (only reachable if validation exited 0) ───────────
      - name: Commit and push
        run: |
          git config user.name  "aluminum-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html engine/market_data.json engine/sentiment_history.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily refresh ${{ steps.d.outputs.date }}"
            git push
          fi

      # ── Diagnostics on failure ────────────────────────────────────────────
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-${{ steps.d.outputs.date }}
          path: |
            engine/market_data.json
            data.json
          retention-days: 14
          if-no-files-found: ignore
