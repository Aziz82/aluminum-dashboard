*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.up{color:var(--up)!important} .dn{color:var(--dn)!important}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ===== header ===== */
.topbar{background:var(--hdr);color:var(--hdrtx);position:sticky;top:0;z-index:50}
.topbar .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 16px;height:52px}
.brand{font-size:18px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand em{color:#f5b83d;font-style:normal}
.brand small{display:block;font-size:10px;font-weight:400;color:var(--hdrmut);letter-spacing:.6px;text-transform:uppercase}
.asof{margin-left:auto;font-size:12px;color:var(--hdrmut);text-align:right;white-space:nowrap}
.tgl{background:var(--hdr2);color:var(--hdrtx);border:1px solid #3a4757;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.tgl:hover{background:#2c3949}
/* ===== ticker ===== */
.ticker{background:var(--hdr2);border-top:1px solid #303c4c;border-bottom:3px solid var(--accent);overflow:hidden;white-space:nowrap}
.ticker .in{display:inline-block;padding:7px 0;animation:tk 55s linear infinite}
.ticker:hover .in{animation-play-state:paused}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tki{display:inline-flex;gap:7px;align-items:baseline;padding:0 22px;border-right:1px solid #33404f;font-size:12.5px;color:var(--hdrtx)}
.tki b{font-weight:600}.tki .num{font-weight:700}
/* ===== quote header ===== */
.qwrap{background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.qin{max-width:1280px;margin:0 auto;padding:16px}
.qtitle{font-size:13px;color:var(--mut)}
.qrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:2px}
.qpx{font-size:38px;font-weight:800;letter-spacing:-.5px}
.qchg{font-size:17px;font-weight:700}
.qbadge{font-size:11px;padding:3px 9px;border-radius:3px;font-weight:700;letter-spacing:.4px}
.qbadge.up{background:var(--upbg)} .qbadge.dn{background:var(--dnbg)}
.qmeta{font-size:11.5px;color:var(--mut);margin-top:4px}
.qstats{display:flex;gap:0;flex-wrap:wrap;margin-top:12px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.qs{flex:1 1 130px;padding:8px 14px;border-right:1px solid var(--line);background:var(--th)}
.qs:last-child{border-right:none}
.qs .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.qs .v{font-size:15px;font-weight:700;margin-top:1px}
/* ===== tabs ===== */
.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:40}
.tabs .in{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tab{padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)} .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
/* ===== layout ===== */
.main{max-width:1280px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);margin-bottom:16px}
.ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ph h2{font-size:14.5px;font-weight:700}
.ph .sub{font-size:11px;color:var(--mut);margin-left:auto;text-align:right}
.pb{padding:12px 14px}
/* ===== tables ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--th);color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
th.num{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hov)}
td .note{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4}
.sym{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--chip);align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--accent);margin-right:8px;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.green{background:var(--up)}.dot.amber{background:#e8a13c}.dot.red{background:var(--dn)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--mut)}
.pill.up{background:var(--upbg);color:var(--up)} .pill.dn{background:var(--dnbg);color:var(--dn)}

.brief h1{font-size:19px;line-height:1.35;font-weight:800;margin-bottom:10px}
.brief li{margin:0 0 9px 18px;font-size:13.5px;color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px 14px;box-shadow:var(--shadow);border-top:3px solid var(--accent)}
.kpi.up{border-top-color:var(--up)} .kpi.dn{border-top-color:var(--dn)}
.kpi .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:23px;font-weight:800;margin:3px 0 1px}
.kpi .c{font-size:12px;font-weight:700}
.kpi .n{font-size:11px;color:var(--mut);margin-top:5px}

.news li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.8px;line-height:1.42}
.news li:last-child{border-bottom:none}
.news .tag{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-right:6px}
.cal li{list-style:none;display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cal li:last-child{border-bottom:none}
.cal .d{flex:none;width:66px;font-weight:700;font-size:11px;color:var(--mut);padding-top:1px}
.cal .imp{flex:none;width:8px;border-radius:2px}

.rail-earn td,.rail-earn th{padding:7px 6px}
.rail-earn .co{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:170px}
.rail-earn .co b{overflow:hidden;text-overflow:ellipsis}
.rail-earn .co .tk{color:var(--mut);font-size:11px;flex:none}
.rail-earn .dot{flex:none;margin-right:0}
.rail-earn td.num{white-space:nowrap;width:64px}
.rail-earn td.dt{white-space:nowrap;width:58px;text-align:right;color:var(--mut)}

.chart{width:100%;position:relative} .chart svg{display:block;width:100%;height:auto}
.ctip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;padding:6px 10px;font-size:11.5px;line-height:1.5;display:none;z-index:5;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:11px;color:var(--mut);padding:4px 2px 0}
.legend b{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle;border-radius:2px}
/* expandable text */
.xp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.xp.open{display:block;overflow:visible}
.xp:not(.open):hover{opacity:.85}
.xp:not(.open)::after{content:'';display:block}
/* executive panels */
.hm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tile{border-radius:5px;padding:10px 12px;color:#fff;cursor:pointer;min-height:66px}
.tile .tl{font-size:12px;font-weight:700;line-height:1.3}
.tile .ts{font-size:10px;opacity:.88;margin-top:4px}
.t-red{background:#b23c30}.t-amber{background:#c9822e}.t-green{background:#20834f}
.plrs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.plr{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:default}
.newscols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ncol h3{font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.gz{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.bigfig{font-size:26px;font-weight:800}
/* mobile */
.pb{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:700px){
  .pb table{min-width:560px}
  .rail-earn{min-width:0!important}
  .qpx{font-size:30px}
  .qin,.pb{padding:10px}
  .main{padding:0 10px;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .brand{font-size:16px}
  .tki{padding:0 14px}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.section{display:none}.section.on{display:block}
.stance{display:flex;align-items:center;gap:14px}
.stance .big{font-size:21px;font-weight:800}
.muted{color:var(--mut);font-size:12px}
.footer{max-width:1280px;margin:8px auto 30px;padding:0 16px;font-size:11px;color:var(--mut)}
</style>

opean Duty Unpaid (EDU)","premium":485,"unit":"$/t","change":0,"basis":"European P1020A duty-unpaid in-warehouse Rotterdam, carried at its last public assessment. PERIODIC ASSESSMENT, not a daily mark - no fresher free public print is available at this refresh, so the value is held at its assessment date rather than implied to have moved. The duty-unpaid leg is the cleanest read on genuine European physical tightness because it excludes both the 6% EU import duty and CBAM.","status":"green"},{"region":"Billets Rotterdam Duty-Paid","premium":1212.5,"unit":"$/t","change":0.0,"basis":"6063 extrusion billet premium, in-warehouse duty-paid Rotterdam (Fastmarkets MB-AL-0002 basis), carried at its last public assessment date. PERIODIC ASSESSMENT - not refreshed daily. Billet premiums carry the duty-paid structure plus the conversion spread over P1020, so they move with both metal availability and extruder order books; European extrusion demand remains the soft spot in the regional balance, and TTF gas around EUR 58.5/MWh continues to cap any restart economics.","status":"green"},{"region":"MW US Transaction (Platts)","premium":2380,"unit":"$/t","change":-16,"basis":"US Midwest transaction premium, carried at its last public assessment date. PERIODIC ASSESSMENT, not a daily mark. TARIFF-INFLATED: this level is not comparable with pre-2026 history because Section 232 at 50% now sits inside it. See the decomposition on the US duty-paid row.","status":"green"},{"region":"US Midwest Duty-Paid","premium":2380,"unit":"$/t","change":-16,"basis":"US Midwest duty-paid P1020A premium, carried at its last public assessment date (periodic, not daily). THE TARIFF DECOMPOSITION IS RE-COMPUTED EVERY RUN because it is a function of the current LME cash: at the 30-Jul cash of $3,231.00 the Section 232 leg alone is 0.50 x $3,231.00 = $1,615.50/t, UP $12.00/t from $1,603.50/t at the 29-Jul cash purely by arithmetic. Every $100 on LME cash mechanically adds $50/t of tariff cost to US duty-paid metal before any change in physical tightness. The residual over that tariff leg is the genuine market premium; the dashboard computes it from the current cash rather than fabricating a freight/financing/tightness split.","status":"green"}],"settlements":[{"quarter":"Q1-26 sett.","MJP":195,"CIF Japan":195,"EU duty-unpaid":519.1},{"quarter":"Q2-26 sett.","MJP":351.5,"CIF Japan":319.5,"EU duty-unpaid":612.5},{"quarter":"Q3-26 settled","MJP":395,"CIF Japan":395,"EU duty-unpaid":542.5},{"quarter":"Now (CIF Japan spot)","MJP":370,"CIF Japan":370,"EU duty-unpaid":485}],"tariffs":[{"region":"United States","rate":"50%","instrument":"Section 232","status":"amber","note":"Full customs value; eff. 08-Jun-2026 → 31-Dec-2027"},{"region":"European Union","rate":"6% + CBAM","instrument":"Import duty","status":"amber","note":"Structural floor plus carbon border adjustment"}],"drivers":[{"text":"Hormuz is now genuinely two-way: oil gave back 1.4% on 30-Jul as transits showed the first signs of normalising in weeks — Gulf war-risk insurance is quoted at 3-10% of hull value against roughly 0.25% before the conflict - a $3m-$10m cost on a $100m vessel versus about $250,000. Roughly 9% of global primary aluminium capacity sits behind this waterway and Gulf output was -34.5% y/y in June. THE DIRECTION OF TRAVEL CHANGED THIS WEEK: after Tehran rejected Oman's Hormuz proposal on 29-Jul and crude surged nearly 7%, a QatarEnergy-controlled LNG tanker exited the strait bound for Pakistan - the first in nearly three weeks - and Brent then eased about 1.4% to roughly $89.46 as tankers continued to ply conflict-zone waters. Trading Economics still describes shipping traffic as largely stalled. If transits normalise durably, the largest single component of the current premium floor begins to erode; if they do not, the constraint persists. This driver is two-sided for the first time in weeks and should not be treated as a one-way support.","source":"Reuters via Business Recorder - QatarEnergy-controlled LNG tanker heads to Pakistan after exiting Hormuz, first in nearly three weeks","url":"https://www.brecorder.com/news/40432505/qatarenergy-controlled-lng-tanker-heads-to-pakistan-after-exiting-hormuz-first-in-nearly-three-weeks"},{"text":"US Section 232 at 50% is now $1,615.50/t of the US duty-paid premium - the 30-Jul cash rise added $12.00/t of tariff cost by arithmetic alone — Aluminium articles made entirely or almost entirely of aluminium pay 50% ad valorem on full customs value; derivative aluminium content pays 25%. The 50%/25% structure originates in Proclamation 11021 of 02-Apr-2026 and carries no stated end date - the 08-Jun-2026 to 31-Dec-2027 window in the 01-Jun-2026 proclamation (91 FR 34085, CBP CSMS #68855869) applies only to the Annex I-C reduced-rate carve-outs, which set 15% all-in for Japan, Korea, the UK, Switzerland, Taiwan and EU members. A 20-Jul-2026 proclamation additionally creates a Commerce-administered onshoring incentive under which companies with an approved plan to build or expand a US primary smelter, with construction beginning by 20-Jan-2029, may import at HALF the applicable rate (25% rather than 50%); no CBP guidance for that measure has been issued yet. MECHANICS THIS RUN: at the 30-Jul cash of $3,231.00 the tariff leg is 0.50 x 3,231.00 = $1,615.50/t, up from $1,603.50/t at the 29-Jul cash. The policy leg moves with the metal price whether or not the physical market changes at all.","source":"US Customs and Border Protection - CSMS #68855869, Section 232 aluminium tariff guidance","url":"https://www.cbp.gov/trade/programs-administration/trade-remedies/section-232-tariffs-aluminum"},{"text":"The EU stack is duty plus CBAM: 6% import duty, and from January 2026 the benchmark Rotterdam duty-paid assessment embeds CBAM cost — The EU applies a 6% import duty on primary aluminium from non-preferential origins. Separately, from January 2026 Fastmarkets' benchmark European P1020A in-warehouse duty-paid Rotterdam assessment includes additional CBAM (Carbon Border Adjustment Mechanism) costs in the same way it already reflects the import duty. That is a methodology change with a real consequence: the European duty-paid premium is no longer a pure physical-tightness signal, it is a physical signal plus two policy layers. The duty-UNPAID assessment is the cleaner read on genuine regional availability, which is why both are carried on this board.","source":"Fastmarkets - Aluminium P1020A premium, in-whs dp Rotterdam methodology (CBAM inclusion from January 2026)","url":"https://www.fastmarkets.com/commodity-prices/aluminium-p1020a-premium-in-whs-dp-rotterdam-dollar-tonne-mb-al-0004/"},{"text":"The demand side just turned: China's July manufacturing PMI at 49.2 is the first contraction since February and cuts against every premium in the stack — Official manufacturing PMI fell to 49.2 in July from 50.3 in June against consensus of 50.1, the first sub-50 reading since February 2026; non-manufacturing fell to 49.0 from 50.2 and the composite output index to 49.3. China is roughly 60% of world primary output and the single largest block of demand. Regional premiums are ultimately a function of where metal wants to go: a contracting Chinese factory sector both frees up domestic units and weakens the pull that supports ex-China premiums. This print landed on the morning of 31-Jul, AFTER the 30-Jul LME official, so no price or premium on this board yet reflects it. It is the clearest public counterweight to the tightness narrative currently visible.","source":"Xinhua / China NBS - China's non-manufacturing PMI drops to 49 in July (31-Jul-2026)","url":"https://english.news.cn/20260731/66ace940492c4932b502ab83350ce6a0/c.html"}]},"alumina":{"prices":[{"label":"Alumina FOB Western Australia (SMM)","value":328.0,"unit":"$/t","note":"SMM assessment $328/mt FOB Western Australia, 09-Jul-2026 - the freshest publicly retrievable ex-China spot mark; no fresher free print is available at this refresh, so it is carried at its assessment date and is NOT a 31-Jul value (22 days old). Against the 30-Jul LME 3M of $3,187.00 this sits at roughly 10.3% of the metal price, comfortably inside the range that leaves smelter margins intact. The China-side direction of travel is softer: national alumina inventory built again to 7.028 Mt, +24,000 t week-on-week, with central-China transactions at a RMB 100-140/t discount to the SHFE August contract and the weakening trend persisting.","status":null},{"label":"Alumina API / Platts FOB Australia","value":330.0,"unit":"$/t","note":"Platts FOB Australia $330/t, 26-Jun-2026 (via S&P Global CERA trade review, published 17-Jul) - up from ~$305/t in early June, then rolling over into July on supply recovery. Quarterly context: Q2-2026 average $307.42/t versus Q1 $306.91/t; Platts CIF China averaged $340.74/t in Q2, +2.83% q/q. S&P CERA puts the 2026 global alumina balance at a 1.79 Mt SURPLUS, narrowing from 2.4 Mt in 2025. STALE - 33 days old.","status":null},{"label":"SMM Alumina Index (China)","value":2730.0,"unit":"Y/t","note":"SMM Alumina Index CNY 2,730.17/mt, 16-Jul-2026, -12.8 CNY week-on-week. Regional spot: Shandong 2,710-2,780 (-10 w/w), Henan 2,730-2,800 (-15), Shanxi 2,750-2,800 (-15), Guangxi 2,600-2,680 (-40), Guizhou 2,760-2,800 (flat). Mysteel's national weighted average was CNY 2,762/t on 10-Jul, -14 w/w, with near-term guidance of CNY 2,600-2,750/t. China's alumina operating rate was 75.04% (+0.66pp w/w) on 88.86 Mt/y operating capacity, weekly output 1.704 Mt.","status":null},{"label":"Platts FOB Australia (CME futures)","value":309.4,"unit":"$/t","note":"Alumina FOB Australia (Platts) CME futures $309.40/t, -0.50% on the session, 24-Jul-2026 via TradingView - the latest published settlement retrievable free of charge and the freshest forward-looking ex-China reference in this table; 6 days old at this refresh. Easing on the building ex-China surplus as EGA's Al Taweelah refinery ramps back after a three-and-a-half-month outage. NEW SUPPLY-SIDE OFFSET FROM THE 29-JUL RIO TINTO RELEASE: Yarwun will be cut 40% from October 2026 on tailings constraints, which removes a tranche of Australian alumina from the surplus in Q4.","status":null},{"label":"Bauxite (Guinea, CIF China)","value":70.0,"unit":"$/dmt","note":"~$70/mt traded (SMM, 05-Jun-2026); Guinea 45/3 grade CIF South China ~$71/mt (22-Jun); Platts CIF China assessed a $69.50/dmt Q2 high on 11-Jun. STALE - the freshest publicly retrievable print is 54 days old and SMM's live assessment is paywalled. Oversupply is deepening: Guinea shipped a RECORD 114.8 Mt in H1-2026, +15% y/y (Mining Weekly, 23-Jul), and China imported 120.93 Mt in H1 (+17.4% y/y). A 2026 export cap near 150 Mt has been considered but NOT implemented.","status":null},{"label":"Caustic soda (China alumina-plant contract, Shanxi)","value":2090.0,"unit":"Y/t","note":"CNY 2,090/t delivered, 50% ion-membrane liquid on a 100% NaOH basis, July purchase price held flat month-on-month at Shanxi alumina plants (SMM, 02-Jul-2026). NOTE: no public FOB NE Asia caustic assessment for July 2026 exists - ICIS and Argus both assess it behind paywalls, and the only free reference ($500-510/t flake FOB NE Asia) is undated 2026 commentary, so it is not published here. This Chinese contract line is the dated, sourceable substitute.","status":null},{"label":"Lime / quicklime (China average)","value":163.0,"unit":"$/t","note":"$163/MT China monthly average for June 2026, against $156/MT in Q1-2026 (IMARC quicklime pricing report). No alumina-refinery-grade lime assessment is published publicly and there is no liquid global index - the causticisation reagent is largely regional and contract-priced, so this generic average is indicative only.","status":null}],"notes":["Alumina is the largest single raw-material line in the smelter cost stack, so the direction of travel matters as much as the level. At roughly $328/t FOB Western Australia against a 30-Jul LME 3M of $3,187.00, alumina is about 10.3% of the metal price - comfortably inside the range that leaves conversion margins intact.","THE CHINA SIDE IS SOFTENING FURTHER: national alumina inventory extended its build to 7.028 Mt, +24,000 t week-on-week, with central-China transactions at a RMB 100-140/t discount to the SHFE August contract and alumina futures seeing sharp position reduction. Bauxite index softness and broadly stable caustic soda are pulling refining costs lower. (SMM via AlCircle, late July 2026)","The two-sidedness should be stated plainly: falling alumina widens smelter margins, but it also removes a cost-push floor beneath the metal price. A metal price supported by a genuine physical squeeze is more durable than one supported by marginal production cost - and right now the cost floor is falling while the price rises.","ALL ALUMINA MARKS ON THIS BOARD ARE PERIODIC ASSESSMENTS carried at their published dates, not daily values. No daily move should be inferred from them."],"history":{"dates":["Q1-26 avg","Q2-26 avg","Now (Jul)","Q3-26e"],"series":{"FOB Australia ($/t)":[306.9,307.4,328,320],"API ex-China ($/t)":[331.4,340.7,330,325]}}},"inputs":{"items":[{"label":"Calcined petroleum coke (CPC, anode-grade)","value":470.0,"unit":"$/t","note":"No public CPC spot print exists for July 2026; the sourceable frame is a $468-524/MT expected range for 2026 with Q1 regional marks of US $385, China $359, Brazil $450, South Korea $586. The feedstock IS dated and rising: Shandong green petcoke settled the June cycle at CNY 3,727.4/t for 3A (+30.5 MoM), 3,470.5 for 3B and 2,868.8 for 3C (published 17-Jul), which is pushing calcined costs up. Petcoke is 70.4% of prebaked anode cost.","status":"red"},{"label":"Coal tar pitch (CTP)","value":4940.0,"unit":"Y/t","note":"Modified CTP June settlement cycle: Shandong CNY 4,938/t (+96 MoM) and Shanxi CNY 4,940/t (+214 MoM), published 17-18 Jul-2026; H1-2026 average CNY 5,009.2/t. Anode binder and a by-product of steel coke ovens, so supply is tied to steel output and the spot market is thin. CTP is 14.95% of prebaked anode cost.","status":"amber"},{"label":"Pre-baked anodes","value":5683.0,"unit":"Y/t","note":"CNY 5,683/t cash (5,707 acceptance) - July 2026 procurement benchmark at a major Shandong smelter, +CNY 30/t month-on-month, published 17-18 Jul-2026. This SNAPPED a run of declines. Production cost is about CNY 5,615.92/t so the average producer margin is only +CNY 67.08/t - margins hover just above breakeven. H2-2026 expected range CNY 5,100-5,800/t on ample supply and firm demand.","status":"amber"},{"label":"Electricity (smelter power)","value":30.0,"unit":"$/MWh","note":"NO DATED 2026 PUBLIC BENCHMARK EXISTS - power is contracted bilaterally and not publicly assessed, so this range is indicative only. Secondary references put China smelters at roughly $40-60/MWh, Europe $70-110/MWh and Canada $26.50-41.00/MWh, with long-term contract economics around $40/MWh against a global specific consumption of ~13,990 kWh/t. The dated, tradeable proxies moved AGAINST smelters this run: Brent +3.64% to $87.15 on 29-Jul and TTF at EUR 56.37/MWh, +31.65% month-on-month with EU storage 54.2% full against 65% a year earlier. Europe's $1,200-1,500/t energy cost versus $650-850/t elsewhere remains the structural swing factor.","status":"red"},{"label":"Aluminium fluoride (AlF3)","value":11280.0,"unit":"Y/t","note":"CNY 11,280-11,700/t, SMM fluoride-salt weekly, 25-Jun-2026 - 34 days stale, the freshest publicly retrievable mark. SMM noted cost pressure continuing to transmit through with support building beneath prices.","status":"amber"},{"label":"Cryolite / bath makeup","value":7000.0,"unit":"Y/t","note":"CNY 7,000-8,500/t, stable, SMM fluoride-salt weekly, 25-Jun-2026 - 34 days stale. Bath chemistry makeup; small share of cash cost and rarely the binding constraint.","status":"green"},{"label":"Cathode / graphite blocks","value":null,"unit":"$/set","note":"NO 2026 PUBLIC PRINT EXISTS. The latest publicly retrievable data is 28-Nov-2025 (North China: 30% graphitised CNY 7,600/t, 50% CNY 8,300/t, SM grade-1 roasted CNY 14,200/t, grade-2 CNY 16,300/t) and is now eight months old, so no value is published on this line. Cathode blocks are a reline consumable and behave more like capex than an operating input.","status":"amber"},{"label":"Silicon metal","value":9100.0,"unit":"Y/t","note":"SMM East China oxygen-blown #553 CNY 9,100-9,300/mt (+450 week-on-week) and #441 CNY 9,400-9,500/mt (+400 w/w), 17-Jul-2026 - a firm move on a China-concentrated supply base. Cross-check on a different basis: Trading Economics silicon CNY 8,270/t on 28-Jul (+0.12%). Alloying demand competes directly with polysilicon and PV.","status":"amber"},{"label":"Magnesium (99.9%)","value":15700.0,"unit":"Y/t","note":"99.90% Mg ingot, Fugu main producing area CNY 15,700-15,800/mt (-50 day-on-day) with mainstream trades around 15,700; FOB China $2,220-2,330/mt (SMM, July 2026). Producers are holding prices firm but weak downstream demand is dragging the market into consolidation. China-concentrated supply.","status":"amber"},{"label":"Copper (LME)","value":13606.0,"unit":"$/t","note":"LME copper 3M official $13,606.00 on the 28-Jul session, -1.20% versus $13,771.00 on 27-Jul, and +8.8% YTD against the 02-Jan-2026 3M official of $12,511.00. Copper fell alongside aluminium on the same dollar/Fed driver. Fully exchange-transparent - the most reliable line in this table. Copper stock drew to 268,775 t.","status":"green"},{"label":"Ti-B grain refiner (AlTi5B1)","value":null,"unit":"$/t","note":"NO PUBLIC PRICE EXISTS FOR THIS PRODUCT. SMM, Fastmarkets and Argus do not assess AlTi5B1 grain refiner; only supplier catalogue listings are available, so no value is published. Bilateral contract pricing, immaterial share of cash cost.","status":"green"}],"logistics":[{"label":"Strait of Hormuz transit","status":"amber","note":"The picture turned two-way for the first time in weeks. On 29-Jul Tehran REJECTED Oman's proposed 50-50 arrangement for managing the strait and airstrikes widened, sending crude up nearly 7% to roughly $90.5/bbl Brent - and Reuters attributed aluminium's 0.9% intraday gain directly to the resulting Gulf supply worry, on a session when copper fell 0.4%. THEN ON 30-JUL a QatarEnergy-controlled LNG tanker exited Hormuz bound for Pakistan, the FIRST in nearly three weeks, and oil slipped as tankers continued to ply conflict-zone waters. Roughly 9% of global primary aluminium capacity and about 80-85% of Gulf aluminium exports depend on this route; Gulf output was -34.5% y/y in June at 332 kt following the March smelter attacks. Commercial transits were at a three-week low as of 27-Jul against roughly 100 ships a day pre-war. Whether Thursday's departure becomes a trend or a one-off is now the single largest swing factor in the premium structure."},{"label":"Red Sea corridor","status":"amber","note":"Bab el-Mandeb traffic has been reported steady despite the Houthi threat, keeping the Suez routing viable for Europe-bound metal and alumina. This remains the less binding of the two chokepoints, but it is a second-order exposure that would compound sharply if Hormuz stays shut into Q4."},{"label":"Gulf war-risk insurance","status":"red","note":"War-risk premiums for Gulf transits are quoted at 3-10% of hull value against roughly 0.25% before the conflict - $3m-$10m on a $100m vessel versus about $250,000 - after Iran resumed tanker attacks and struck two UAE supertankers on 14-Jul. Roughly $7m per transit is the commonly cited working figure. Around 6,000 seafarers were reported trapped in the region. This is the single largest non-tariff cost wedge in Gulf-origin delivered prices and it re-escalated with the 29-Jul news."},{"label":"Baltic Dry Index (BDI)","status":"green","note":"Off a mid-month peak near 2,944. Dry-bulk direction matters most for bauxite and alumina freight into China, where Guinea shipped a record 114.8 Mt in H1. Easing bulk rates partly offset the war-risk wedge on the alumina leg."},{"label":"Container freight (Drewry WCI)","status":"green","note":"Drewry's World Container Index fell 4% to $4,374 per 40ft on 23-Jul, with Shanghai-Rotterdam at $4,824, after peaking at $4,639 on 09-Jul - the highest since September 2024 and roughly 61% above a year earlier. Direction is easing, but several carriers have filed Emergency Fuel Surcharges effective August 2026 on continued Hormuz disruption, so realised container cost falls more slowly than the index."},{"label":"Incoterms / demurrage","status":"red","note":"EGA's force majeure on European billet contracts, declared 12-Apr-2026, remained in force as of 20-Jul. Contract mechanics - war-risk clauses, demurrage exposure and force-majeure triggers - remain live commercial variables wherever Gulf-origin metal or Hormuz-transiting alumina is involved. Indonesia has separately delayed alumina and nickel shipments over a regulatory gap on rare-earth content in cargoes, with no rule defining a maximum allowable level."}]},"macro":{"row":[{"label":"Brent crude","value":89.46,"unit":"$/bbl","day_pct":-1.42,"note":"Brent around $89.46 at this 31-Jul refresh, easing about 1.4% and extending the pullback from the 29-Jul near-7% surge, as tankers continued to transit conflict-zone waters and a QatarEnergy-controlled LNG carrier exited Hormuz - the first in nearly three weeks. Crude is still set for a strong monthly advance. The read-across stays two-sided: energy is the largest single smelter cost line, so the same Gulf escalation that bids the metal also raises the cost of making it. A sustained retreat in Brent removes some of the supply-fear premium embedded in the flat price. (Trading Economics)","status":null},{"label":"US Dollar Index","value":100.03,"unit":"DXY","day_pct":-0.85,"note":"DXY around 100.03, DOWN roughly 0.85% and back below the 101 handle after being described as near one-month highs during the 29-Jul session. THE CONTRAST WITH YESTERDAY MATTERS: on 29-Jul aluminium rose alone into a firm dollar; on 30-Jul the dollar softened and the whole complex rose with it - copper 3M +1.19%, zinc +0.61%. So 30-Jul was NOT a decoupling session, it was a macro-assisted one. Strip the dollar tailwind out and aluminium's +0.31% on 3M was the more modest half of the move; the curve did the rest. (Trading Economics)","status":null},{"label":"EUR/USD","value":1.1476,"unit":null,"day_pct":0.83,"note":"EUR/USD at 1.14760 on the 30-Jul LME FX fix (Westmetall MTLE), up 0.83% from 1.13820 on 29-Jul; the ECB fixing matched at 1.14760. The ECB held its deposit rate at 2.25% on 23-Jul. The euro-side energy exposure remains the binding constraint on any European smelter restart: TTF gas is around EUR 58.5/MWh having touched EUR 64.02/MWh on 24-Jul, an 18-week high, with EU storage well behind last year.","status":null},{"label":"USD/CNY","value":6.7468,"unit":null,"day_pct":-0.2,"note":"Yuan 6.74676, firming about 0.20%. THE DOMINANT CHINA DATAPOINT THIS RUN IS THE PMI: July manufacturing 49.2 (June 50.3, consensus 50.1), the first sub-50 print since February 2026; non-manufacturing 49.0 from 50.2; composite output 49.3. Against that, China's operating primary capacity reached 45.31 Mt/y at end-June, BREACHING its own 45 Mt ceiling - so the supply side is at its cap while the demand side has just turned negative. Domestic alumina inventory extended its build to 7.028 Mt, +24 kt w/w. The most-traded SHFE aluminium contract settled around RMB 23,480/t.","status":null},{"label":"USD/JPY","value":159.96,"unit":null,"day_pct":-2.1,"note":"Yen 159.964, STRENGTHENING sharply by about 2.1% - a notable move that takes USD/JPY back below 160 from roughly 163.4. A firmer yen raises the local-currency cost of dollar-denominated metal for Japanese buyers and is a mild negative at the margin for MJP appetite, with Q4-2026 CIF Japan negotiations expected to open around late August.","status":null},{"label":"US 10Y yield","value":4.68,"unit":"%","day_pct":-0.01,"note":"US 10-year around 4.677%, effectively unchanged. The curve context is the story: the Fed held at 3.50-3.75% on 29-Jul on a 9-3 vote with three dissents FOR a hike, and the Bank of England held at 3.75% on 30-Jul on a 6-3 vote with three dissents FOR a hike (Greene, Pill, Mann). Two major central banks now carry a sizeable minority arguing rates should be higher, with the 30-year Treasury yield at its highest since 2007. Tightening risk is deferred, not removed.","status":null}],"events":[{"date":"31-Jul 02:30 London","event":"CHINA JULY MANUFACTURING PMI 49.2, FIRST CONTRACTION SINCE F","importance":"high","note":"CHINA JULY MANUFACTURING PMI 49.2, FIRST CONTRACTION SINCE FEBRUARY 2026 - down from 50.3 in June and below consensus of 50.1. Non-manufacturing PMI 49.0 (from 50.2); composite output index 49.3. The largest single block of aluminium demand has signalled contraction across both factory and services activity. Landed AFTER the 30-Jul LME official, so no price on this board reflects it. (Xinhua / NBS)"},{"date":"30-Jul 13:20 London","event":"LME 30-JUL OFFICIAL","importance":"high","note":"LME 30-JUL OFFICIAL: aluminium cash $3,231.00 (+$24.00, +0.75%), 3M $3,187.00 (+$10.00, +0.31%), stock 266,300 t (-1,500 t). Cash is the highest official since 23-Jun-2026. Cash-3M backwardation widened a third consecutive session to +$44.00. (Westmetall)"},{"date":"30-Jul 12:00 London","event":"BANK OF ENGLAND HELD BANK RATE AT 3.75% ON A 6-3 VOTE - the ","importance":"high","note":"BANK OF ENGLAND HELD BANK RATE AT 3.75% ON A 6-3 VOTE - the fifth hold this year, but with THREE dissents for a 25bp HIKE (Greene, Pill, Mann), up from two at the previous meeting, as energy price pressures linger. Governor Bailey played down the prospect of hikes at the press conference. One day after the Fed's 9-3 hold with three hike dissents. (CNBC / Bloomberg)"},{"date":"30-Jul","event":"BROAD BASE-METALS SESSION, NOT A DECOUPLING","importance":"medium","note":"BROAD BASE-METALS SESSION, NOT A DECOUPLING: the dollar softened (DXY -0.85%; EUR/USD 1.14760 from 1.13820 on the LME fix) and copper 3M rose 1.19% to $13,770 with zinc +0.61% to $3,601. Nickel -0.15% and lead -0.73% were the exceptions. Aluminium's distinguishing feature was the CURVE rather than the flat price. (Westmetall officials)"},{"date":"30-Jul","event":"COPPER STOCK DREW 6,900 t TO 255,400 t on the same session -","importance":"medium","note":"COPPER STOCK DREW 6,900 t TO 255,400 t on the same session - the base-metals complex is drawing inventory broadly, not just aluminium, which argues part of the tightness signal is systemic rather than aluminium-specific. Zinc stock 100,700 t (-1,100 t); lead 445,850 t (-1,350 t); nickel unchanged at 267,522 t. (Westmetall)"},{"date":"30-Jul","event":"OIL EASED ~1.4% TO ABOUT $89.46 BRENT after the 29-Jul near-","importance":"medium","note":"OIL EASED ~1.4% TO ABOUT $89.46 BRENT after the 29-Jul near-7% surge, with a QatarEnergy-controlled LNG tanker having exited Hormuz bound for Pakistan - the first in nearly three weeks - and tankers continuing to transit conflict-zone waters. Crude still set for a strong monthly advance. (Trading Economics / Reuters via Business Recorder)"},{"date":"30-Jul","event":"CHINA ALUMINA INVENTORY EXTENDED ITS BUILD to 7.028 Mt natio","importance":"medium","note":"CHINA ALUMINA INVENTORY EXTENDED ITS BUILD to 7.028 Mt nationwide, +24,000 t week-on-week, with central-China transactions at a RMB 100-140/t discount to the SHFE August contract and the weakening trend persisting. Alumina cost pressure on smelters continues to ease. (SMM / AlCircle)"},{"date":"30-Jul","event":"USD/JPY FELL ABOUT 2.1% TO 159.96, back below 160 from rough","importance":"medium","note":"USD/JPY FELL ABOUT 2.1% TO 159.96, back below 160 from roughly 163.4 - a firmer yen raises the local-currency cost of dollar-denominated metal for Japanese buyers ahead of Q4-2026 CIF Japan premium talks expected to open around late August. (Trading Economics)"}]},"news":{"headlines":[{"ts":null,"title":"THE CURVE, NOT THE FLAT PRICE, IS THE STORY. The 30-Jul official put cash at $3,231.00 (+$24.00, +0.75%) against 3M at $3,187.00 (+$10.00, +0.31%) - cash rose more than twice as fast, pushing the cash-3M backwardation to +$44.00, a THIRD consecutive session of widening from +$16.00 (28-Jul) and +$30.00 (29-Jul). The spread has now expanded through a $32.50 fall, a $47.50 rally and a $24.00 rally. A prompt premium that widens irrespective of flat-price direction is set by physical availability rather than positioning, which makes this a more durable tightness read than any single day's price.","source":"Westmetall - LME official settlements (30-Jul-2026)","tag":"Curve / Structure","impact":"Bullish","url":"https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Al_cash"},{"ts":null,"title":"CHINA'S JULY MANUFACTURING PMI FELL TO 49.2 - THE FIRST CONTRACTION SINCE FEBRUARY 2026 - from 50.3 in June and against consensus of 50.1. Non-manufacturing PMI dropped to 49.0 from 50.2 and the composite output index to 49.3, so the weakness spans factories and services alike. China is roughly 60% of world primary aluminium output and the largest single block of demand. This is the clearest public counterweight to the ex-China tightness narrative in weeks, and it landed on the morning of 31-Jul, AFTER the 30-Jul LME official - no price on this board reflects it.","source":"Xinhua / China National Bureau of Statistics (31-Jul-2026); investingLive - China July manufacturing PMI 49.2 vs 50.0 expected","tag":"Demand / China","impact":"Bearish","url":"https://english.news.cn/20260731/66ace940492c4932b502ab83350ce6a0/c.html"},{"ts":null,"title":"EXCHANGE STOCK DREW ANOTHER 1,500 t TO 266,300 t, a fresh low this century on LME records back to January 1998 and -47.7% year to date from 509,250 t on 02-Jan. The draw has now run 22 consecutive published sessions without a single build, averaging roughly -1,600 t/day through July. Available on-warrant metal remains at a 16-month low and is dominated by Russian-origin material many consumers will not take, so the freely deliverable buffer is thinner than the headline tonnage implies. The complex is drawing broadly - copper stock fell 6,900 t to 255,400 t on the same session.","source":"Westmetall (30-Jul-2026); Mining Weekly - LME aluminium stocks fall to lowest this century (27-Jul-2026)","tag":"Inventory","impact":"Bullish","url":"https://www.miningweekly.com/article/lme-aluminium-stocks-fall-to-lowest-this-century-2026-07-27"},{"ts":null,"title":"THE BANK OF ENGLAND HELD AT 3.75% ON A 6-3 VOTE WITH THREE DISSENTS FOR A HIKE - Greene, Pill and Mann, up from two dissenters last meeting, as energy price pressures linger. It is the fifth hold this year; Governor Bailey played down the prospect of hikes. Coming one day after the Federal Reserve held at 3.50-3.75% on a 9-3 vote with three dissents also FOR a hike, two major central banks now carry a hawkish minority of three apiece, with the 30-year Treasury yield at its highest since 2007. Tightening risk has been deferred, not removed - a persistent headwind for dollar-denominated commodities.","source":"CNBC / Bloomberg / Washington Post (30-Jul-2026)","tag":"Macro / Rates","impact":"Bearish","url":"https://www.cnbc.com/2026/07/30/interest-rates-inflation-bank-of-england.html"},{"ts":null,"title":"HORMUZ HAS TURNED TWO-WAY FOR THE FIRST TIME IN WEEKS. After Tehran rejected Oman's transit proposal on 29-Jul and crude surged nearly 7%, a QatarEnergy-controlled LNG tanker exited the strait bound for Pakistan - the first in nearly three weeks - and Brent then eased about 1.4% to roughly $89.46 as tankers continued to ply conflict-zone waters. Trading Economics still describes shipping traffic as largely stalled and around 9% of global primary capacity sits behind the waterway, with Gulf output -34.5% y/y in June. Durable normalisation would erode the largest single support under the current premium structure; continued disruption sustains it.","source":"Reuters via Business Recorder (30-Jul-2026); Trading Economics commodity note (30-Jul-2026)","tag":"Supply / Geopolitics","impact":"Mixed","url":"https://www.brecorder.com/news/40432505/qatarenergy-controlled-lng-tanker-heads-to-pakistan-after-exiting-hormuz-first-in-nearly-three-weeks"},{"ts":null,"title":"CHINA'S ALUMINA INVENTORY EXTENDED ITS BUILD TO 7.028 Mt NATIONWIDE, +24,000 t week-on-week, with central-China transactions at a RMB 100-140/t discount to the SHFE August contract and the weakening trend persisting; alumina futures saw sharp position reduction. Bauxite index softness and broadly stable caustic soda are pulling refining costs lower. For smelters this is unambiguously margin-positive: the largest single raw-material line is easing while the metal price makes new highs for the move - but it also removes a cost-push floor under the metal price itself.","source":"SMM (Shanghai Metals Market) via AlCircle - alumina weakens on inventory buildup (late July 2026)","tag":"Cost base / Alumina","impact":"Bullish (margin)","url":"https://www.alcircle.com/press-release/shfe-aluminium-edges-higher-in-consolidative-recovery-alumina-weakens-on-inventory-buildup-prompting-position-reductions-and-exits-120539"},{"ts":null,"title":"THE SUPPLY PIPELINE REMAINS THE STRUCTURAL COUNTERWEIGHT. China's operating primary capacity reached 45.31 Mt/y at end-June, breaching its own 45 Mt ceiling, while Indonesia adds roughly 705 kt in 2026 (+89% y/y) with Tsingshan planning a further 800 kt at Weda Bay. Rio Tinto's H1-2026 primary aluminium production was 1,676 kt, flat year on year, with alumina up 8% to 4,040 kt as QAL consolidated at 100%. Consensus continues to expect 2027-28 surpluses even as 2026 runs a 720-930 kt deficit - the current tightness is a timing and logistics problem, not a permanent capacity shortfall.","source":"Rio Tinto Q2 2026 production results (14-Jul-2026); SMM / industry capacity data","tag":"Supply / Capacity","impact":"Bearish","url":"https://www.riotinto.com/en/news/releases/2026/rio-tinto-releases-second-quarter-2026-production-results"}]},"forward":{"as_of":"2026-07-31","basis":"LME official prices via Westmetall. Baseline = LME 3-month official (a traded market price). Range = random-walk cone from realized volatility. Driver score = 3 transparent rules, hit rate measured on history.","source":"London Metal Exchange official settlements via Westmetall (https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Al_cash)","spot_cash":3231.0,"forward_3m":3187.0,"vol":{"weekly_pct":3.2,"annual_pct":23.1,"window_weeks":26,"full_sample_weekly_pct":2.49},"cone":[{"horizon":"1 month","weeks":4,"central":3187.0,"lo68":2989.5,"hi68":3397.5,"lo95":2811.5,"hi95":3612.7},{"horizon":"3 months","weeks":13,"central":3187.0,"lo68":2839.9,"hi68":3576.5,"lo95":2542.3,"hi95":3995.2},{"horizon":"6 months","weeks":26,"central":3187.0,"lo68":2707.4,"hi68":3751.5,"lo95":2315.1,"hi95":4387.3}],"cone_path":[{"date":"2026-08-06","weeks":1,"central":3187.0,"lo68":3086.7,"hi68":3290.6,"lo95":2993.4,"hi95":3393.2},{"date":"2026-08-13","weeks":2,"central":3187.0,"lo68":3046.1,"hi68":3334.5,"lo95":2916.6,"hi95":3482.4},{"date":"2026-08-20","weeks":3,"central":3187.0,"lo68":3015.3,"hi68":3368.5,"lo95":2859.1,"hi95":3552.5},{"date":"2026-08-27","weeks":4,"central":3187.0,"lo68":2989.5,"hi68":3397.5,"lo95":2811.5,"hi95":3612.7},{"date":"2026-09-03","weeks":5,"central":3187.0,"lo68":2967.0,"hi68":3423.3,"lo95":2770.2,"hi95":3666.5},{"date":"2026-09-10","weeks":6,"central":3187.0,"lo68":2946.9,"hi68":3446.7,"lo95":2733.4,"hi95":3715.9},{"date":"2026-09-17","weeks":7,"central":3187.0,"lo68":2928.4,"hi68":3468.4,"lo95":2700.0,"hi95":3761.9},{"date":"2026-09-24","weeks":8,"central":3187.0,"lo68":2911.4,"hi68":3488.7,"lo95":2669.2,"hi95":3805.2},{"date":"2026-10-01","weeks":9,"central":3187.0,"lo68":2895.4,"hi68":3507.9,"lo95":2640.7,"hi95":3846.4},{"date":"2026-10-08","w n Q2 after Q1 weather disruption.","src":["Rio Tinto Q2-2026 production results","https://www.riotinto.com/en/news/releases/2026/rio-tinto-releases-second-quarter-2026-production-results"],"asof":"2026-07-31"},{"name":"EGA (Al Taweelah)","status":"Restart","impact":"easing","update":"Al Taweelah alumina refinery restarting after a roughly three-and-a-half-month outage - flagged publicly as potential supply relief for the regional alumina balance.","src":["Trading Economics - aluminum commodity note (20-Jul-2026)","https://tradingeconomics.com/commodity/aluminum"],"asof":"2026-07-31"},{"name":"Vedanta Aluminium (VEDL)","status":"Record output","impact":"neutral","update":"Record 632 kt production quarter (Q1 FY27, +5% y/y) with record value-added output of 389 kt (+14% y/y); results reported 30-Jul.","src":["Vedanta Q1 FY27 production/results disclosures (public)","https://www.vedantalimited.com/investor-relations/"],"asof":"2026-07-31"},{"name":"Gulf producers (region)","status":"Constrained","impact":"tightening","update":"Roughly 9% of global primary capacity sits behind the Strait of Hormuz; Gulf output was -34.5% y/y in June with shipping traffic still described as largely stalled, though the first LNG tanker in nearly three weeks exited on 30-Jul.","src":["Trading Economics / Reuters via Business Recorder","https://www.brecorder.com/news/40432505/qatarenergy-controlled-lng-tanker-heads-to-pakistan-after-exiting-hormuz-first-in-nearly-three-weeks"],"asof":"2026-07-31"},{"name":"China operators (aggregate)","status":"At capacity cap","impact":"tightening","update":"Operating primary capacity reached 45.31 Mt/y at end-June, through the country's own 45 Mt ceiling - the supply side is at its cap while July's PMI shows demand contracting.","src":["SMM via AlCircle - China H1 2026 review","https://www.alcircle.com/press-release/china-aluminium-market-h1-2026-review-and-h2-outlook-120287"],"asof":"2026-07-31"},{"name":"Tsingshan (Weda Bay)","status":"Expansion","impact":"loosening","update":"Indonesia adds roughly 705 kt of new capacity in 2026 (+89% y/y) with Tsingshan planning a further 800 kt at Weda Bay - the structural counterweight behind consensus 2027-28 surplus expectations.","src":["Public capacity reporting (SMM / industry press)","https://www.alcircle.com/press-release/china-aluminium-market-h1-2026-review-and-h2-outlook-120287"],"asof":"2026-07-31"}]},"trade":{"asof":"2026-07-31","note":"Indicative corridors with publicly sourced shares/figures - NOT tonnage estimates. Refresh monthly or on material change.","flows":[{"from":"Gulf (GCC)","to":"Asia & Europe","impact":"tightening","note":"~9% of global primary supply exits via the Strait of Hormuz; Gulf output -34.5% y/y in June; transits disrupted since the ceasefire collapse, first LNG exit in ~3 weeks on 30-Jul","src":["Trading Economics / Reuters","https://tradingeconomics.com/commodity/aluminum"]},{"from":"China","to":"World (semis)","impact":"swing","note":"~60% of global primary output; the 45 Mt capacity cap is binding at 45.31 Mt/y - semis exports are the swing valve between the domestic surplus and the ex-China deficit","src":["Trading Economics / SMM","https://tradingeconomics.com/commodity/aluminum"]},{"from":"Canada","to":"United States","impact":"policy-taxed","note":"Primary metal into the US pays Section 232 at 50% on customs value; Alcoa flagged ~$35m of added tariff cost on Canadian metal in Q2 alone","src":["CBP Section 232 guidance / Alcoa Q2 disclosures","https://www.cbp.gov/trade/programs-administration/trade-remedies/section-232-tariffs-aluminum"]},{"from":"Indonesia","to":"Asia","impact":"loosening","note":"+705 kt new primary capacity in 2026 (+89% y/y), Tsingshan Weda Bay +800 kt planned - the incremental supply corridor consensus expects to tip 2027-28 into surplus","src":["Public capacity reporting (SMM / industry press)","https://www.alcircle.com/press-release/china-aluminium-market-h1-2026-review-and-h2-outlook-120287"]}]},"outlook":{"consensus":[{"bank":"Citi (May-26)","target":4000.0,"horizon":"2026","stance":"neutral"},{"bank":"Morgan Stanley","target":3700.0,"horizon":"2026","stance":"neutral"},{"bank":"Goldman Sachs (21-Jun)","target":3300.0,"horizon":"2026","stance":"neutral"},{"bank":"World Bank (Apr-26 CMO)","target":3200.0,"horizon":"2026","stance":"neutral"},{"bank":"Reuters analyst poll","target":2946.0,"horizon":"2026","stance":"neutral"},{"bank":"InCred (28-Jul, bear)","target":800.0,"horizon":"2026","stance":"neutral"}],"catalysts":[{"text":"TODAY'S LME OFFICIAL (13:20 London) - the first official struck AFTER China's sub-50 July PMI. The single most informative tell available: whether the cash-3M backwardation holds above +$40.00 into a contractionary demand print. Holding it would be a strong confirmation that the tightness is physical; a rapid collapse toward flat would say the spread was carrying macro and speculative content","date":"Fri 31-Jul","direction":"up"},{"text":"Month-end July close - July's monthly average becomes the reference for August prior-month comparisons, and month-end index rebalancing plus option expiry flows can distort the prompt spread independently of physical conditions","date":"Fri 31-Jul","direction":"flat"},{"text":"China Caixin manufacturing PMI for July - the private-survey cross-check on the official 49.2. Caixin skews toward smaller, export-oriented and coastal manufacturers, so a divergence between the two would say the weakness is concentrated in either the state or the private sector rather than economy-wide","date":"Mon 03-Aug","direction":"up"},{"text":"Whether LME stock breaks 265,000 t. The draw has run 22 consecutive published sessions without a build at roughly -1,600 t/day; on that run rate the level breaks within days. The more important variable is the AVAILABLE on-warrant component, currently at a 16-month low and dominated by Russian-origin material","date":"Early Aug","direction":"up"},{"text":"Hormuz transit counts - after the first LNG tanker exit in nearly three weeks, whether normalisation is sustained or reverses. Roughly 9% of global primary capacity sits behind the waterway and Gulf output was -34.5% y/y in June; this remains the single largest swing factor in the ex-China balance","date":"Early Aug","direction":"up"},{"text":"SMM weekly China aluminium ingot and billet social inventory - the direct test of whether a contracting PMI is translating into physical destocking or restocking. Billet inventory had already built for two consecutive weeks to 121,000 t as at 23-Jul, an off-season demand signal that pre-dated the PMI","date":"Aug","direction":"up"},{"text":"Q4-2026 MJP CIF Japan premium negotiations expected to open. Q3 settled at $395/t, an 11-year high. Talks will open against a widening LME backwardation and century-low exchange stock, but also against a contracting Chinese PMI and a firmer yen (USD/JPY back below 160)","date":"Late Aug","direction":"up"},{"text":"China August PMI and industrial output - whether July's 49.2 was a single-month distortion or the start of a demand downturn. Two consecutive contractionary prints would materially change the 2026 balance estimates that currently underpin the 720-930 kt deficit consensus","date":"Sep","direction":"up"},{"text":"FOMC with a Summary of Economic Projections. The July meeting held at 3.50-3.75% on a 9-3 vote with three dissents FOR a hike - the most opposite-direction dissents since September 2016. The SEP will show whether the hawkish minority is spreading to the median dot","date":"15-16 Sep","direction":"up"},{"text":"Bank of England MPC. Held at 3.75% on 30-Jul on a 6-3 vote with dissents from Greene, Pill and Mann for a hike, up from two dissenters previously. A fourth dissenter would put a genuine hike on the table for a second major central bank","date":"Sep","direction":"flat"},{"text":"Indonesian and Chinese capacity additions landing against consensus expectations of 2027-28 surpluses - the structural counterweight to the current squeeze. Indonesia adds roughly 705 kt in 2026 (+89% y/y) with Tsingshan planning a further 800 kt at Weda Bay","date":"Q4-26 / 2027","direction":"up"}],"risks":[{"text":"CHINA DEMAND HAS TURNED - July manufacturing PMI 49.2, the first contraction since February 2026, with non-manufacturing at 49.0 and composite at 49.3; China is roughly 60% of world primary output and the largest single demand block","likelihood":"high","impact":"high","trend":"rising"},{"text":"Tightening risk is DEFERRED, NOT REMOVED - the Fed held 9-3 and the Bank of England held 6-3, each with three dissents in favour of a 25bp HIKE, and the 30-year Treasury yield is at its highest since 2007","likelihood":"high","impact":"medium","trend":"rising"},{"text":"Hormuz normalisation would erode the premium floor - the first LNG tanker exit in nearly three weeks and a 1.4% pullback in Brent suggest the constraint is now two-way rather than one-way support","likelihood":"medium","impact":"high","trend":"fading"},{"text":"Indonesian and Chinese supply overwhelms the deficit - Indonesia +705 kt in 2026 at +89% y/y, China operating capacity already through its 45 Mt ceiling at 45.31 Mt/y, Tsingshan planning a further 800 kt at Weda Bay; consensus expects 2027-28 surpluses","likelihood":"high","impact":"high","trend":"rising"},{"text":"The backwardation is thin-market driven rather than consumption driven - a prompt premium can widen because deliverable metal is unavailable or unwanted (Russian-origin on-warrant units) rather than because demand is strong, which makes it a poor forecast of balance","likelihood":"medium","impact":"medium","trend":"stable"},{"text":"Falling alumina removes cost-push support - China alumina inventory built to 7.028 Mt (+24 kt w/w) with central-China transactions at a RMB 100-140/t discount, easing the marginal cost floor beneath the metal price even as it widens smelter margins","likelihood":"medium","impact":"medium","trend":"fading"}],"balance":[{"year":"2025","value":"-100 kt","label":"Deficit"},{"year":"2026","value":"-720 to -930 kt","label":"Deficit - Goldman -720 kt, Norsk Hydro -900 kt, Macquarie -930 kt; Citi an outlier at -2.7 Mt. China alone ran a 322 kt deficit in June, and exchange inventory at a fresh century low leaves no absorption capacity"},{"year":"2027","value":"Surplus returns","label":"Consensus expects surpluses as Gulf output recovers and Indonesia ramps; Concord Resources warns the market may be 'too complacent about supply risks' in the meantime. Rio Tinto's 40% Yarwun alumina cut from October 2026 trims one input to that surplus"}],"sentiment_history":[{"date":"2026-06-30","net":-79},{"date":"2026-07-01","net":-8},{"date":"2026-07-02","net":-46},{"date":"2026-07-03","net":-18},{"date":"2026-07-04","net":6},{"date":"2026-07-05","net":5},{"date":"2026-07-06","net":10},{"date":"2026-07-07","net":15},{"date":"2026-07-08","net":40},{"date":"2026-07-09","net":25},{"date":"2026-07-11","net":-43},{"date":"2026-07-12","net":0},{"date":"2026-07-13","net":33},{"date":"2026-07-14","net":8},{"date":"2026-07-15","net":17},{"date":"2026-07-16","net":-25},{"date":"2026-07-18","net":-42},{"date":"2026-07-19","net":-9},{"date":"2026-07-20","net":-9},{"date":"2026-07-21","net":36},{"date":"2026-07-22","net":9},{"date":"2026-07-23","net":25},{"date":"2026-07-24","net":58},{"date":"2026-07-25","net":-17},{"date":"2026-07-26","net":-28},{"date":"2026-07-27","net":-16},{"date":"2026-07-28","net":27},{"date":"2026-07-29","net":-7},{"date":"2026-07-30","net":33},{"date":"2026-07-31","net":0}]},"sources":{"caveats":["SESSION BASIS: every LME figure on this board is the 30-JULY-2026 OFFICIAL, published 13:20 London on Thursday. This report is compiled at approximately 06:05 London on Friday 31-July, BEFORE today's ring. Today's official prints at 13:20 London. No price shown reflects today's session.","THE WHOLE BASE-METALS BOARD IS ON ONE UNIFORM SESSION (30-Jul) - aluminium, copper, nickel, zinc and lead all taken from the Westmetall overview page for the same date. Note for the record: Westmetall's per-metal aluminium data-table page was serving stale cached snapshots at this refresh (returning 29-Jul, 24-Jul and 17-Jul on successive requests) while the overview page carried the correct 30-Jul officials; the overview figures were used and cross-checked against the copper, nickel, zinc and lead tables, which had all updated to 30-Jul.","CHINA'S JULY PMI (49.2 manufacturing, 49.0 non-manufacturing, 49.3 composite) WAS RELEASED ON THE MORNING OF 31-JULY, AFTER the 30-July LME official. It is therefore NOT reflected in any price, spread or premium on this board. It is carried in the commentary because it is the most material public development since the last official.","SPREAD CONVENTION: cash ABOVE 3M is BACKWARDATION (positive Cash-3M) and signals nearby tightness; cash BELOW 3M is contango. The current +$44.00 is a backwardation.","YTD PERCENTAGES ON THE METALS BOARD ARE DERIVED, NOT EXCHANGE-PUBLISHED. Each metal is measured against its first published 2026 LME 3-month official on 02-Jan-2026: aluminium $3,010.50, copper $12,511.00, nickel $16,915.00, zinc $3,130.50, lead $2,008.00. Other providers using different base dates or a cash basis will show different figures.","PREMIUM ASSESSMENTS ARE PERIODIC, NOT DAILY. MJP, CIF Japan spot, EDU, Rotterdam billets, MW US Transaction and US Midwest duty-paid are carried at their last published assessment dates. Where no fresher public print exists the previous mark is held at its date rather than implied to have moved. The CIF Japan spot mark of $370/t dates from 06-Jul-2026 and is 25 days old.","THE TARIFF DECOMPOSITION IS RE-COMPUTED EVERY RUN because it is a pure function of the current LME cash: at $3,231.00 the Section 232 leg is 0.50 x 3,231.00 = $1,615.50/t. The residual over that leg is the market premium. NO freight, financing or tightness split is fabricated - only the tariff arithmetic and the residual are shown.","US PREMIUMS ARE TARIFF-INFLATED and are NOT comparable with pre-2026 history. European duty-paid assessments have embedded CBAM cost since January 2026 in addition to the 6% import duty, so the duty-UNPAID mark is the cleaner read on genuine regional physical tightness.","THE Q4-2026 MJP FIGURE IS A SCENARIO RANGE ONLY ($335-420/t), not a settlement and not a forecast of one. No public producer offers or negotiation levels have been reported as at 31-Jul-2026; talks are expected to open around late August.","ALUMINA AND RAW-MATERIAL MARKS are periodic assessments carried at their published dates. The $328/t FOB Western Australia mark dates from 09-Jul-2026 and is 22 days old.","MONTHLY AVERAGE BASIS: the 'avg' column on the benchmark table is the JUNE-2026 monthly mean (cash $3,458.6 over 22 sessions; 3M $3,438.9). July is not a complete month until today's session settles, so the prior-month convention still points at June.","THE ELLIOTT WAVE SECTION IS TECHNICAL CONTEXT, NOT ADVICE. Wave counts are interpretive, alternate counts are stated with probabilities, and explicit invalidation levels are given. Historical pivots are confirmed swings only; forward projections are clearly labelled as such.","PUBLIC INFORMATION ONLY. Every figure and claim on this dashboard traces to a public source listed in the Sources section. Nothing confidential, internal or company-specific is published - no realised prices, net-backs, shipping lanes, volumes, costs or internal commentary. The only company-specific content is public listed-company disclosure in the peer-earnings table.","THIS IS GENERIC MARKET INTELLIGENCE FOR SITUATIONAL AWARENESS, not a recommendation, not a trading signal and not a company position. Figures are as published by the cited sources and are not independently audited.","NO EXCEL ARCHIVE IS PRODUCED ON THE DAILY RUN. The dated Excel archive is generated by the separate weekly task.","EARNINGS TREND STRIPS (Earning tab): last-4-period figures are shown ONLY where the exact public number was verified (currently Alcoa adj EPS, Norsk Hydro adj EBITDA, Century Aluminum adj EPS with a Q3-25 gap). Metrics differ by company and are labelled per company; they are NOT comparable across companies. Remaining companies will be back-filled with sourced figures on subsequent runs.","BASE-METALS 12-MONTH TRENDS: zinc and lead series are monthly CASH AVERAGES (Westmetall averages pages) rebased to 100 at Jun-25 with the last point the current month's average-to-date; the aluminium/copper/nickel series are carried on their pre-existing rebased basis. Trends are indicative direction, not a precise cross-metal comparison."],"references":[{"name":"Westmetall - LME official settlements, stocks and FX. ALL SIX METALS PUBLISHED THROUGH 30-JUL-2026 on the overview page (uniform session). Aluminium 30-Jul: cash $3,231.00 / 3M $3,187.00 / stock 266,300 t (-1,500 t). Copper $13,795.00/$13,770.00/255,400 t; Zinc $3,662.00/$3,601.00/100,700 t; Lead $1,863.00/$1,900.00/445,850 t; Nickel $16,945.00/$17,170.00/267,522 t. EUR/USD LME fix 1.14760 vs 1.13820","url":"https://www.westmetall.com/en/markdaten.php"},{"name":"Westmetall - LME Aluminium historical daily series (cash, 3M, stock) used for lme_series and the 02-Jan-2026 YTD base of $3,010.50 on 3M","url":"https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Al_cash"},{"name":"Xinhua / China National Bureau of Statistics - China's non-manufacturing PMI drops to 49 in July; manufacturing PMI 49.2, composite output index 49.3 (31-Jul-2026)","url":"https://english.news.cn/20260731/66ace940492c4932b502ab83350ce6a0/c.html"},{"name":"investingLive - China July manufacturing PMI 49.2 vs 50.0 expected, down from 50.3, first contraction since February 2026","url":"https://investinglive.com/news/china-july-manufacturing-pmi-49-2-vs-50-0-expected/"},{"name":"CNBC - Bank of England holds UK interest rate steady at 3.75%, 6-3 vote with Greene, Pill and Mann dissenting for a 25bp hike; policymakers see benchmark assessment from January 2026","url":"https://www.fastmarkets.com/commodity-prices/aluminium-p1020a-premium-in-whs-dp-rotterdam-dollar-tonne-mb-al-0004/"},{"name":"SMM (Shanghai Metals Market) via AlCircle - SHFE aluminium consolidative recovery; alumina weakens on inventory buildup to 7.028 Mt (+24 kt w/w), central-China discount RMB 100-140/t (late July 2026)","url":"https://www.alcircle.com/press-release/shfe-aluminium-edges-higher-in-consolidative-recovery-alumina-weakens-on-inventory-buildup-prompting-position-reductions-and-exits-120539"},{"name":"Rio Tinto - Second quarter 2026 production results: primary aluminium 841 kt in Q2 (flat y/y), H1 1,676 kt; alumina +8% y/y (14-Jul-2026)","url":"https://www.riotinto.com/en/news/releases/2026/rio-tinto-releases-second-quarter-2026-production-results"},{"name":"AlCircle - Alcoa Q2-2026: ~$4bn revenue (+24% q/q), net income $407m, adjusted net income $562m, adjusted EBITDA $901m (+51% q/q), aluminium production 636 kt (+5% q/q)","url":"https://www.alcircle.com/news/alcoa-s-4bn-q226-portland-smelter-restart-lifts-aluminium-output-and-earnings-120425"},{"name":"Reuters via Business Recorder - Norsk Hydro Q2 core profit beats forecasts: adjusted EBITDA NOK 8.92bn vs NOK 7.79bn a year earlier","url":"https://www.brecorder.com/news/40431235/aluminium-producer-norsk-hydros-q2-core-profit-beats-forecasts"}]}}</script>
<script>
"use strict";
/* ---------- data ---------- */
let D = JSON.parse(document.getElementById('embedded-data').textContent);
fetch('data.json').then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.meta&&j.meta.as_of>=D.meta.as_of){D=j;render();} }).catch(()=>{});
/* ---------- helpers ---------- */
const $=(s)=>document.querySelector(s);
const fmt=(n,d=1)=> n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n)=> n==null?'—':(n>0?'+':'')+fmt(n,2)+'%';
const cls=(n)=> n>0?'up':(n<0?'dn':'');
const arrow=(n)=> n>0?'▲':(n<0?'▼':'—');
const esc=(s)=> String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const clip=(s,n)=> {s=String(s??'');return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s;};
const xp=(s,l=3)=>`<div class="xp" style="-webkit-line-clamp:${l}" title="Click to expand / collapse" onclick="this.classList.toggle('open')">${esc(s)}</div>`;
/* ---------- theme ---------- */
const savedTheme=localStorage.getItem('alm-theme'); if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$('#tglBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('alm-theme',t);render();};
/* ---------- svg chart helpers (interactive) ---------- */
const chartReg={}; let chartSeq=0;
function regChart(meta){const cid='c'+(++chartSeq);chartReg[cid]=meta;return cid;}
function lineChart(o){
  const W=o.w||860,H=o.h||300,P={l:52,r:o.r2?56:14,t:14,b:26};
  const xs=o.labels.length, X=i=>P.l+(W-P.l-P.r)*(xs===1?0:i/(xs-1));
  function mk(vals,pad=0.06){let lo=Math.min(...vals),hi=Math.max(...vals);const sp=(hi-lo)||1;lo-=sp*pad;hi+=sp*pad;return{Y:v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo)),lo,hi};}
  let s='';

  o.series.forEach(se=>{

    if(se.fill)s+=`<polygon points="${P.l},${H-P.b} ${pts} ${X(xs-1)},${H-P.b}" fill="${se.color}" opacity="0.10"/>`;

function coneChart(f){
  const W=860,H=300,P={l:52,r:14,t:14,b:26};
  const histRows=f.history.slice(-40), hist=histRows.map(h=>h.price), path=f.cone_path;
  const n1=hist.length,N=n1+path.length;
  const X=i=>P.l+(W-P.l-P.r)*i/(N-1);
  const all=[...hist,...path.flatMap(p=>[p.lo95,p.hi95])];
  let lo=Math.min(...all),hi=Math.max(...all);const sp=hi-lo;lo-=sp*.04;hi+=sp*.04;
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  let s='';
  for(let g=0;g<=4;g++){const y=P.t+(H-P.t-P.b)*g/4,v=hi-(hi-lo)*g/4;
    s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(v,0)}</text>`;}
  const band=(loK,hiK,op)=>{const up=path.map((p,i)=>`${X(n1+i)},${Y(p[hiK])}`).join(' ');
    const dn=path.slice().reverse().map((p,i)=>`${X(n1+path.length-1-i)},${Y(p[loK])}`).join(' ');
    s+=`<polygon points="${X(n1-1)},${Y(hist[n1-1])} ${up} ${dn}" fill="var(--accent)" opacity="${op}"/>`;};
  band('lo95','hi95',0.08); band('lo68','hi68',0.14);
  s+=`<polyline points="${hist.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--tx)" stroke-width="2"/>`;
  s+=`<polyline points="${X(n1-1)},${Y(hist[n1-1])} ${path.map((p,i)=>`${X(n1+i)},${Y(p.central)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<line x1="${X(n1-1)}" x2="${X(n1-1)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--mut)" stroke-dasharray="2 3"/>`;
  s+=`<text x="${X(n1-1)}" y="${P.t+10}" font-size="10" fill="var(--mut)" text-anchor="end">now </text>`;
  [[0,histRows[0].date],[n1-1,'now'],[N-1,path[path.length-1].date]].forEach(([i,t])=>s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(t)}</text>`);
  const labels=[...histRows.map(h=>h.date),...path.map(p=>p.date)];
  const mkRow=(name,color,d,get)=>({name,color,d,vals:labels.map((_,i)=>{const v=get(i);return v==null?null:{y:Y(v),v};})});
  const meta={W,H,P,labels,xs:labels.map((_,i)=>X(i)),rows:[
    mkRow('Cash (weekly)','var(--tx)',1,i=>i<n1?hist[i]:null),
    mkRow('Central path','var(--accent)',0,i=>i>=n1?path[i-n1].central:null),
    mkRow('68% high','#7a9bd6',0,i=>i>=n1?path[i-n1].hi68:null),
    mkRow('68% low','#7a9bd6',0,i=>i>=n1?path[i-n1].lo68:null)]};
  return `<svg data-cid="${regChart(meta)}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}
function wireCharts(){
 document.querySelectorAll('svg[data-cid]').forEach(svg=>{
  const reg=chartReg[svg.dataset.cid]; if(!reg||svg.__wired) return; svg.__wired=true;
  const parent=svg.parentElement;
  const tip=document.createElement('div'); tip.className='ctip'; parent.appendChild(tip);
  const NS='http://www.w3.org/2000/svg';
  const ch=document.createElementNS(NS,'line');
  ch.setAttribute('y1',reg.P.t); ch.setAttribute('y2',reg.H-reg.P.b);
  ch.setAttribute('stroke','var(--mut)'); ch.setAttribute('stroke-dasharray','3 3'); ch.setAttribute('visibility','hidden');
  svg.appendChild(ch);
  const dots=reg.rows.map(r=>{const c=document.createElementNS(NS,'circle'); c.setAttribute('r','3.5'); c.setAttribute('fill',r.color); c.setAttribute('stroke','var(--panel)'); c.setAttribute('stroke-width','1.5'); c.setAttribute('visibility','hidden'); svg.appendChild(c); return c;});
  const onPoint=e=>{
    const rect=svg.getBoundingClientRect(); if(!rect.width) return;
    const xv=(e.clientX-rect.left)*reg.W/rect.width;
    const n=reg.labels.length;
    let i=Math.round((xv-reg.P.l)/(reg.W-reg.P.l-reg.P.r)*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    const x=reg.xs[i];
    ch.setAttribute('x1',x); ch.setAttribute('x2',x); ch.setAttribute('visibility','visible');
    let html=`<b>${esc(reg.labels[i]??'')}</b>`;
    reg.rows.forEach((r,k)=>{const p=r.vals[i];
      if(p){dots[k].setAttribute('cx',x); dots[k].setAttribute('cy',p.y); dots[k].setAttribute('visibility','visible');
        html+=`<div><span style="color:${r.color}">●</span> ${esc(r.name)}: <b>${fmt(p.v,r.d)}</b></div>`;}
      else dots[k].setAttribute('visibility','hidden');});
    tip.innerHTML=html; tip.style.display='block';
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    tip.style.left=Math.max(0,Math.min(px+14,rect.width-180))+'px';
    tip.style.top=Math.max(0,py-10)+'px';
  };
  const hide=()=>{tip.style.display='none'; ch.setAttribute('visibility','hidden'); dots.forEach(d=>d.setAttribute('visibility','hidden'));};
  svg.addEventListener('mousemove',onPoint);
  svg.addEventListener('mouseleave',hide);
  svg.addEventListener('touchstart',e=>{if(e.touches[0])onPoint({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});},{passive:true});
  svg.addEventListener('touchmove',e=>{if(e.touches[0])onPoint({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});},{passive:true});
  svg.addEventListener('touchend',()=>setTimeout(hide,1500));
 });
}
