   {n:'LME 3M',d:b0.day_pct>0?1:b0.day_pct<0?-1:0,why:`Rule: sign of the day move — ${pct(b0.day_pct)}`},
   {n:'Curve',d:bm.spread>0?1:-1,why:`Rule: backwardation = tight — cash−3M ${bm.spread>0?'+':''}${fmt(bm.spread,1)} (${bm.structure})`},
   {n:'Premiums',d:pq==null?0:pq>0?1:-1,why:`Rule: last settled MJP quarter vs prior — ${pq==null?'n/a':(pq>0?'+':'')+fmt(pq,1)+' $/t q/q'}`},
   {n:'Alumina',d:ad==null?0:ad>0?1:-1,why:`Rule: last two history points of ${ak||'index'} — ${ad==null?'n/a':(ad>0?'+':'')+fmt(ad,1)}`},
   {n:'Macro (USD)',d:dxy.day_pct<0?1:dxy.day_pct>0?-1:0,why:`Rule: softer dollar = supportive — DXY ${pct(dxy.day_pct)}`},
  ];
  return panel('Pillar Reads',`<div class="plrs">`+P.map(p=>`<span class="plr" title="${esc(p.why)}"><b>${esc(p.n)}</b><span class="${p.d>0?'up':p.d<0?'dn':''}" style="font-weight:800">${p.d>0?'▲':p.d<0?'▼':'—'}</span></span>`).join('')+
   `</div><div class="muted" style="margin-top:7px;font-size:11px;text-align:center">Rule-based reads computed from today's published data — hover any chip for the exact rule. Direction of today's evidence, NOT a forecast.</div>`);
}
function newsSplitPanel(){
  const hs=(D.news.headlines||[]);
  const grp=(re)=>hs.filter(h=>re.test(String(h.tag||'')+' '+String(h.impact||'')+' '+String(h.title||'').slice(0,0)) );
  const by=(kind)=>hs.filter(h=>{const t=String(h.impact||'');return kind==='bull'?/bull/i.test(t):kind==='bear'?/bear/i.test(t):!/bull|bear/i.test(t);});
  const col=(title,items,cls)=>`<div class="ncol"><h3 class="${cls}">${title} (${items.length})</h3><ul class="news">`+
    items.map(h=>`<li>${xp(h.title,3)}${h.url?`<a href="${esc(h.url)}" target="_blank" style="font-size:11px">source</a>`:''}</li>`).join('')+`</ul></div>`;
  return panel('News by Tone',`<div class="newscols">${col('Supportive',by('bull'),'up')}${col('Adverse',by('bear'),'dn')}${col('Mixed / Watch',by('mixed'),'')}</div>`,'tagged from public headlines');
}
function heatPanel(){
  const rs=((D.outlook||{}).risks||[]);
  const tiles=rs.map(r=>{
    const t=trendDir(r.trend), imp=String(r.impact||'').toLowerCase();
    const cls=(t==='up'&&imp==='high')?'t-red':t==='up'?'t-amber':t==='down'?'t-green':'t-amber';
    const label=String(r.text||'').split(/ [—-] /)[0];
    return `<div class="tile ${cls}" title="${esc(r.text)} (click for the full risk register)" onclick="curTab=5;render();setTimeout(()=>{const e=document.getElementById('risk-register');if(e)e.scrollIntoView({behavior:'smooth'});},60);">
      <div class="tl">${esc(label)}</div><div class="ts">likelihood ${esc(r.likelihood||'—')} · impact ${esc(r.impact||'—')} · ${t==='up'?'rising':t==='down'?'easing':'stable'}</div></div>`;}).join('');
  return panel('Risk Heat Map',`<div class="hm">${tiles}</div><div class="muted" style="margin-top:7px;font-size:11px">Red = high-impact rising · amber = building/stable · green = easing. Click a tile for the full register.</div>`);
}
function producersPanel(){
  const ps=((D.producers||{}).status||[]);
  if(!ps.length)return '';
  const dot=(im)=>/tighten/i.test(im)?'red':/loosen|eas/i.test(im)?'green':/pos/i.test(im)?'green':'amber';
  return panel('Producer Monitor',`<table><thead><tr><th>Producer</th><th>Status</th><th>Update</th><th></th></tr></thead><tbody>`+
   ps.map(p=>`<tr><td style="min-width:150px"><span class="dot ${dot(p.impact)}"></span><b>${esc(p.name)}</b></td>
    <td><span class="pill">${esc(p.status)}</span></td>
    <td class="note" style="max-width:460px">${xp(p.update,2)}</td>
    <td>${p.src&&p.src[1]?`<a href="${esc(p.src[1])}" target="_blank">src</a>`:''}</td></tr>`).join('')+
   `</tbody></table>`,'public disclosures & press only · dot = market-balance effect');
}
function tradePanel(){
  const tr=D.trade||{}; const fl=tr.flows||[];
  if(!fl.length)return '';
  return panel('Trade Corridors',`<table><thead><tr><th>Corridor</th><th>Read</th><th>Why it matters</th><th></th></tr></thead><tbody>`+
   fl.map(x=>`<tr><td style="min-width:170px;white-space:nowrap"><b>${esc(x.from)}</b> ➜ <b>${esc(x.to)}</b></td>
    <td><span class="pill ${/tighten/i.test(x.impact)?'dn':/loosen/i.test(x.impact)?'up':''}">${esc(x.impact)}</span></td>
    <td class="note" style="max-width:460px">${xp(x.note,2)}</td>
    <td>${x.src&&x.src[1]?`<a href="${esc(x.src[1])}" target="_blank">src</a>`:''}</td></tr>`).join('')+
   `</tbody></table>`,esc(tr.note||''));
}
/* ---------- tab sections ---------- */
let curTab=0;
const SECTIONS=[
 /* Overview */
 ()=>{
  const k=D.kpis.map(x=>`<div class="kpi ${x.trend==='up'?'up':x.trend==='down'?'dn':''}">
    <div class="l">${esc(x.label)}</div><div class="v">${fmt(x.value,x.decimals??1)} <span class="muted" style="font-size:12px">${esc(x.unit||'')}</span></div>
    <div class="c ${cls(x.change_pct)}">${arrow(x.change_pct)} ${pct(x.change_pct)}</div>
    <div class="n">${xp(x.note,3)}</div></div>`).join('');
  const s=D.lme.series, rev=(a)=>a.slice().reverse();
  const chart=lineChart({labels:rev(s.dates),series:[{name:'Cash official $/t',vals:rev(s.price),color:'var(--accent)',w:2.4,fill:true,d:1}],r2:{name:'LME stock (t)',vals:rev(s.stocks),color:'#e8a13c',d:0}});
  return panel('Daily Brief',`<div class="brief"><h1>${esc(D.brief.headline)}</h1><ul>${D.brief.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`,`as of ${esc(D.meta.as_of)}`)+
   `<div class="kpis">${k}</div>`+
   panel('LME Aluminium — Price &amp; Exchange Stock (15 sessions)',`<div class="chart">${chart}</div>
    <div class="legend"><span><b style="background:var(--accent)"></b>Cash official $/t</span><span><b style="background:#e8a13c"></b>LME stock (t, right)</span></div>`,'officials via Westmetall')+
   `<div class="grid2">${gaugePanel(D.forward||{})}${balancePanel()}</div>`+
   pillarStrip()+
   panel('LME Board',benchTable())+
   panel('Base Metals',boardTable())+
   newsSplitPanel()+
   heatPanel()+
   producersPanel()+
   tradePanel();
 },
 /* Markets */
 ()=>{
  const s=D.lme.series, rev=a=>a.slice().reverse();
  const h=D.base_metals.history;
  const cmp=lineChart({labels:h.dates,series:[
    {name:'Aluminium',vals:h.series.AL,color:'var(--accent)',w:2.4},{name:'Copper',vals:h.series.CU,color:'#c96a2a',w:1.8},{name:'Nickel',vals:h.series.NI,color:'#7a8794',w:1.8,dash:'4 3'}]});
  const rows=s.dates.map((d,i)=>{
    const spr=s.price[i]-0; return {d,c:s.price[i],st:s.stocks[i]};});
  return panel('Aluminium vs Copper vs Nickel — rebased 100',`<div class="chart">${cmp}</div>
    <div class="legend"><span><b style="background:var(--accent)"></b>Aluminium</span><span><b style="background:#c96a2a"></b>Copper</span><span><b style="background:#7a8794"></b>Nickel</span></div>`,'monthly, rebased Jun-25=100')+
   panel('LME Officials — last 15 sessions',`<table><thead><tr><th>Date</th><th class="num">Cash $/t</th><th class="num">Stock t</th><th class="num">Δ Stock</th></tr></thead><tbody>`+
    s.dates.map((dt,i)=>{const dS=i<s.dates.length-1?s.stocks[i]-s.stocks[i+1]:null;
     return `<tr><td><b>${esc(dt)}</b></td><td class="num">${fmt(s.price[i],1)}</td><td class="num">${fmt(s.stocks[i],0)}</td><td class="num ${dS==null?'':(dS<0?'dn':'up')}">${dS==null?'—':fmt(dS,0)}</td></tr>`;}).join('')+`</tbody></table>`,'newest first')+
   panel('Commentary',`<p style="font-size:13.5px;line-height:1.6">${esc(D.lme.commentary)}</p>`);
 },
 /* Premiums */
 ()=>{
  const reg=`<table><thead><tr><th>Region / Instrument</th><th class="num">Premium $/t</th><th class="num">Change</th><th>Basis</th></tr></thead><tbody>`+
   D.premiums.regional.map(r=>`<tr><td style="min-width:150px"><span class="dot ${esc(r.status||'amber')}"></span><b>${esc(r.region)}</b></td>
    <td class="num"><b>${fmt(r.premium,1)}</b></td><td class="num ${cls(r.change)}">${r.change==null?'—':(r.change>0?'+':'')+fmt(r.change,1)}</td>
    <td class="note" style="max-width:520px">${xp(r.basis,3)}</td></tr>`).join('')+`</tbody></table>`;
  const setr=D.premiums.settlements;
  const cols=Object.keys(setr[0]).filter(x=>x!=='quarter');
  const sett=`<table><thead><tr><th>Quarter</th>${cols.map(c=>`<th class="num">${esc(c)}</th>`).join('')}</tr></thead><tbody>`+
   setr.map(r=>`<tr><td><b>${esc(r.quarter)}</b></td>${cols.map(c=>`<td class="num">${fmt(r[c],1)}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;
  const tar=D.premiums.tariffs.map(t=>`<tr><td><b>${esc(t.region)}</b></td><td class="num"><b>${esc(t.rate)}</b></td><td>${esc(t.instrument)}</td><td class="note">${esc(t.note)}</td></tr>`).join('');
  const drv=`<ul class="news">`+D.premiums.drivers.map(x=>`<li>${xp(x.text||x,4)} ${x.url?`<a href="${esc(x.url)}" target="_blank">source</a>`:''}</li>`).join('')+`</ul>`;
  return panel('Regional Premiums',reg,'periodic assessments — carried at assessment date')+
   `<div class="grid2">`+panel('Quarterly Settlements',sett,'MJP CIF Japan (Platts)')+
   panel('Tariff / Policy Stack',`<table><thead><tr><th>Region</th><th class="num">Rate</th><th>Instrument</th><th>Note</th></tr></thead><tbody>${tar}</tbody></table>`)+`</div>`+
   panel('Premium Drivers',drv,'each with public source');
 },
 /* Alumina & Inputs */
 ()=>{
  const pr=`<table><thead><tr><th>Assessment</th><th class="num">Value</th><th>Note</th></tr></thead><tbody>`+
   D.alumina.prices.map(r=>`<tr><td style="min-width:170px"><b>${esc(r.label)}</b></td><td class="num"><b>${fmt(r.value,1)}</b> <span class="muted">${esc(r.unit||'')}</span></td><td class="note" style="max-width:520px">${xp(r.note,3)}</td></tr>`).join('')+`</tbody></table>`;
  const it=`<table><thead><tr><th>Input</th><th class="num">Value</th><th>Note</th></tr></thead><tbody>`+
   D.inputs.items.map(r=>`<tr><td style="min-width:170px"><b>${esc(r.label)}</b></td><td class="num">${fmt(r.value,1)} <span class="muted">${esc(r.unit||'')}</span></td><td class="note" style="max-width:520px">${xp(r.note,3)}</td></tr>`).join('')+`</tbody></table>`;
  const lg=`<table><thead><tr><th>Route / Cost line</th><th>Status</th><th>Note</th></tr></thead><tbody>`+
   D.inputs.logistics.map(r=>`<tr><td style="min-width:160px"><b>${esc(r.label)}</b></td><td><span class="dot ${esc(r.status||'amber')}"></span>${esc(r.status||'')}</td><td class="note" style="max-width:520px">${xp(r.note,3)}</td></tr>`).join('')+`</tbody></table>`;
  return panel('Alumina',pr,'periodic marks, carried at date')+
   panel('Alumina Notes',`<ul class="news">${D.alumina.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`)+
   panel('Smelter Input Basket',it)+panel('Logistics &amp; Freight',lg);
 },
 /* Macro */
 ()=>{
  const rows=D.macro.row.map(r=>`<tr><td style="min-width:140px"><b>${esc(r.label)}</b></td>
   <td class="num"><b>${fmt(r.value,2)}</b> <span class="muted">${esc(r.unit||'')}</span></td>
   <td class="num ${cls(r.day_pct)}">${arrow(r.day_pct)} ${pct(r.day_pct)}</td>
   <td class="note" style="max-width:560px">${xp(r.note,3)}</td></tr>`).join('');
  return panel('Macro Board',`<table><thead><tr><th>Series</th><th class="num">Level</th><th class="num">Day</th><th>Read</th></tr></thead><tbody>${rows}</tbody></table>`)+
   panel('Macro Events',`<ul class="news">${D.macro.events.map(e=>`<li>${xp(e,4)}</li>`).join('')}</ul>`);
 },
 /* Outlook */
 ()=>{
  const f=D.forward;
  const drv=f.drivers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="num">${esc(x.value)}</td>
    <td><span class="pill ${/Tighten/i.test(x.reading)?'up':(/Loosen|Eas/i.test(x.reading)?'dn':'')}">${esc(x.reading)}</span></td><td class="note">${esc(x.rule)}</td></tr>`).join('');
  const cons=D.outlook.consensus.map(c=>`<tr><td><b>${esc(c.bank)}</b></td><td class="num">${fmt(c.target,0)}</td><td>${esc(c.horizon)}</td><td><span class="pill">${esc(c.stance)}</span></td></tr>`).join('');
  const risks=D.outlook.risks.map(r=>`<tr><td class="note" style="max-width:480px">${xp(r.text,3)}</td>
    <td><span class="pill ${r.likelihood==='High'?'dn':''}">${esc(r.likelihood)}</span></td>
    <td><span class="pill ${r.impact==='High'?'dn':''}">${esc(r.impact)}</span></td>
    <td class="num ${trendDir(r.trend)==='up'?'dn':trendDir(r.trend)==='down'?'up':''}" title="${esc(r.trend||'stable')}">${trendDir(r.trend)==='up'?'▲':trendDir(r.trend)==='down'?'▼':'—'}</td></tr>`).join('');
  return panel('Model Forward Cone — 6 months',`<div class="chart">${coneChart(f)}</div>
    <div class="legend"><span><b style="background:var(--tx)"></b>Weekly cash history</span><span><b style="background:var(--accent)"></b>Central path / 68% / 95% bands</span></div>
    <p class="muted" style="margin-top:8px">Volatility-cone projection off ${esc(f.basis)} — weekly σ ${fmt(f.vol.weekly_pct,1)}%, annualised ${fmt(f.vol.annual_pct,1)}%. Diagnostic, not a forecast. Stance: <b>${esc(f.stance)}</b> (${f.score}/${f.score_max}).</p>`,esc(f.as_of))+
   panel('Stance Drivers',`<table><thead><tr><th>Driver</th><th class="num">Value</th><th>Reading</th><th>Rule</th></tr></thead><tbody>${drv}</tbody></table>`)+
   `<div class="grid2">`+
   panel('Street Consensus',`<table><thead><tr><th>House</th><th class="num">Target $/t</th><th>Horizon</th><th>Stance</th></tr></thead><tbody>${cons}</tbody></table>`)+
   panel('Risk Register',`<table><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th class="num">Trend</th></tr></thead><tbody>${risks}</tbody></table>`,'','risk-register')+`</div>`;
 },
 /* Peers */
 ()=>{
  const rows=peersSorted().map(p=>{
    const chips=[
      p.eps!=null?`<span class="pill">EPS ${fmt(p.eps,2)}</span>`:'',
      p.revenue_bn!=null?`<span class="pill">Rev $${fmt(p.revenue_bn,2)}bn</span>`:'',
      p.yoy_pct!=null?`<span class="pill ${cls(p.yoy_pct)}">${pct(p.yoy_pct)} y/y</span>`:'',
    ].filter(Boolean).join(' ');
    return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
     <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
       <span class="sym">${esc((p.ticker||p.company).slice(0,3).toUpperCase())}</span>
       <b style="font-size:14.5px">${esc(p.company)}</b>
       <span class="muted">${esc(p.ticker||'')} · ${esc(p.period||'')}${p.group?' · '+esc(p.group):''}</span>
       ${sentPill(p.sentiment)}
       ${isNew(p)?'<span class="pill up">new</span>':''}
       <span class="muted" style="margin-left:auto">${esc(p.reported||'')}${p.url?` · <a href="${esc(p.url)}" target="_blank">IR ↗</a>`:''}</span>
     </div>
     ${chips?`<div style="margin:7px 0 0">${chips}</div>`:''}
     ${p.history&&p.history.points&&p.history.points.length?`<div style="margin:8px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
       <span class="muted" style="font-size:11px;font-weight:700">${esc(p.history.unit)}:</span>
       ${p.history.points.map(pt=>`<span class="pill ${pt[1]>0?'up':pt[1]<0?'dn':''}">${esc(pt[0])} · ${fmt(pt[1],2)}</span>`).join('')}
       ${spark(p.history.points.map(pt=>pt[1]),80,22)}
       ${p.history.src&&p.history.src[1]?`<a href="${esc(p.history.src[1])}" target="_blank" style="font-size:11px">src</a>`:''}
     </div>`:''}
     ${p.headline?`<div style="margin-top:7px;font-size:13px;line-height:1.5"><b>Results:</b> ${esc(p.headline)}</div>`:''}
     ${p.readthrough?`<div class="note" style="margin-top:5px;font-size:12.5px;line-height:1.5"><b>Read-through:</b> ${esc(p.readthrough)}</div>`:''}
    </div>`;}).join('');
  return panel('Earning Companies — listed producers, public disclosures (newest first)',`<div>${rows}</div>`,
   `${peersSorted().length} companies · <span class="dot green"></span>positive <span class="dot amber"></span>mixed <span class="dot red"></span>negative`);
 },
 /* Sources */
 ()=>{
  const refs=D.sources.references.map(r=>`<li>${xp(r.name,2)} ${r.url?`— <a href="${esc(r.url)}" target="_blank">${esc(r.url.replace(/^https?:\/\//,'').split('/')[0])}</a>`:''}</li>`).join('');
  const cav=D.sources.caveats.map(c=>`<li>${esc(c)}</li>`).join('');
  return panel('Sources &amp; References',`<ul class="news">${refs}</ul>`,'every figure traces to a public source')+
   panel('Caveats &amp; Methodology',`<ul class="news">${cav}</ul>`);
 },
];
render();
</script>
